<html lang="zh-HK" data-theme="dark">
<head>

    <title>港鐵實時資訊網 MTR Live Info</title>

        /* 🎨 主題顏色變數設定 (5款精選風格) */
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #38bdf8;
            --border-color: #333333;
            --header-bg: #1f1f1f;
            --row-bg: #252525;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
            --row-bg: #f9f9fb;
        }
        :root[data-theme="pink"] {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #5a3d40;
            --accent-color: #e75480;
            --border-color: #ffb6c1;
            --header-bg: #ffe4e1;
            --row-bg: #fff8fa;
        }
        :root[data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #edf2f4;
            --accent-color: #4cc9f0;
            --border-color: #3a506b;
            --header-bg: #1c2541;
            --row-bg: #232d4c;
        }
        :root[data-theme="natural"] {
            --bg-color: #f3edd5;
            --card-bg: #fffbf0;
            --text-color: #4a3b32;
            --accent-color: #558b2f;
            --border-color: #d7ccc8;
            --header-bg: #e8dfc8;
            --row-bg: #f7f2e4;
        }

        /* 🌐 全局基本樣式 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }

        /* 📱 側邊導航選單 (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .sidebar-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .sidebar-section label {
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Autocomplete 建議列表樣式 */
        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* 遮罩背景 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1500;
        }
        .overlay.show {
            display: block;
        }

        /* 頁面切換內容區 */
        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        /* 搜尋結果：全新靚靚卡片行設計 */
        .direction-title {
            background-color: var(--row-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 12px 0 8px 0;
            font-size: 14px;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }

        .train-card-row {
            background-color: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .train-time-left {
            opacity: 0.8;
            font-weight: 500;
        }

        .time-badge {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        /* 按鈕樣式 */
        .action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }

        /* 取消 Pin 按鈕 */
        .unpin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .unpin-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">...</button>

        <div class="auto-refresh-badge">⏱️ 15s</div>

        <div class="menu-item" onclick="switchPage('search', 'searchTitle', this)" id="menuSearch">🔍 搜尋全港車站</div>
        <div class="menu-item" onclick="switchPage('transfer', 'transferTitle', this)" id="menuTransfer">🗺️ 港鐵路綫圖與轉車</div>
        <div class="menu-item" onclick="switchPage('lift', 'liftTitle', this)" id="menuLift">🛗 車站地面升降機</div>

        <div class="sidebar-section">
            <label for="themeSelect" id="themeLabel">🎨 選擇外觀風格：</label>

                <option value="light">白色風格 (Light Mode)</option>
                <option value="pink">粉紅色風格 (Pink Theme)</option>
                <option value="blue">深藍色風格 (Dark Blue)</option>
                <option value="natural">自然風格 (Natural Style)</option>
            </select>
        </div>

        <div class="sidebar-section">
            <label for="langSelect" id="langLabel">🌐 選擇語言 / Language：</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="zh">繁體中文</option>
                <option value="en">English</option>
            </select>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="container">

        <!-- 頁面 1：釘選站 (Pinned) -->
        <div id="page-pinned" class="page-content active">
            <div id="pinnedStationsContainer">
                <div class="card">
                    <p style="text-align: center;" id="loadingPinnedText">⏳ 正在向港鐵系統取得實時數據...</p>
                </div>
            </div>
            <p style="text-align: center; font-size: 13px; opacity: 0.6;" id="tipPinnedText">💡 提示：畫面每 15 秒會在背景自動更新一次。</p>
        </div>

        <!-- 頁面 2：搜尋全港車站 -->
        <div id="page-search" class="page-content">
            <div class="card">
                <h3 id="searchCardTitle">🔍 搜尋全港車站候車時間</h3>
                
                <label for="stationInputText" id="labelDirectInput">直接輸入車站名稱：</label>
                <div class="autocomplete-wrapper">
                    <div style="display: flex; gap: 8px; margin-bottom: 0;">
                        <input type="text" id="stationInputText" placeholder="例如: 將軍澳..." style="margin-bottom:0; flex:1;" oninput="handleInputSearch(this.value)">
                        <button class="action-btn" style="width: auto; margin-top: 0; padding: 0 15px;" onclick="searchByText()" id="btnTextSearch">查詢</button>
                    </div>
                    <div id="suggestionsList" class="suggestions-list"></div>
                </div>

                <div style="text-align: center; margin: 15px 0 10px 0; font-size: 12px; opacity: 0.5;" id="orDivider">- 或使用選單搜尋 -</div>

                <label for="lineSelect" id="labelSelectLine">選擇鐵路綫：</label>
                <select id="lineSelect" onchange="updateStationOptions()">
                    <option value="" disabled selected id="optSelectLineDefault">-- 請選擇鐵路綫 --</option>
                    <option value="TWL" id="optTWL">荃灣綫</option>
                    <option value="ISL" id="optISL">港島綫</option>
                    <option value="KTL" id="optKTL">觀塘綫</option>
                    <option value="SIL" id="optSIL">南港島綫</option>
                    <option value="TKL" id="optTKL">將軍澳綫</option>
                    <option value="EAL" id="optEAL">東鐵綫</option>
                    <option value="TML" id="optTML">屯馬綫</option>
                    <option value="TCL" id="optTCL">東涌綫</option>
                </select>

                <label for="stationSelect" id="labelSelectStation">選擇車站：</label>
                <select id="stationSelect">
                    <option value="" disabled selected id="optSelectStationDefault">-- 請先選擇鐵路綫 --</option>
                </select>

                <button class="action-btn" onclick="searchStationTime()" id="btnMenuSearch">立即查詢</button>
            </div>

            <!-- 搜尋結果展示區 -->
            <div id="searchResultContainer"></div>
        </div>

        <!-- 頁面 3：港鐵路綫圖與轉車 -->
        <div id="page-transfer" class="page-content">
            <div class="card">
                <h3 id="transferCardTitle">🗺️ 港鐵路綫圖與轉車</h3>

            </div>
        </div>

                <p id="liftEmptyText">（雙軌查詢與升降機卡片準備中...）</p>
            </div>
        </div>

    </div>

            const destMap = {

        function formatArrivalTime(rawTime) {
            if (rawTime === undefined || rawTime === null) return { text: translations[currentLang].arrNoData, timeStr: "" };

            let arrivalDate;
            let num = Number(rawTime);
            let now = new Date();

            if (!isNaN(num)) {
                arrivalDate = new Date(now.getTime() + num * 60000);
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = num <= 0 ? translations[currentLang].arrArrived : `${num} 分鐘`;
                return { text: text, timeStr: timeStr };
            } else {
                arrivalDate = new Date(rawTime.replace(/-/g, "/"));
                let diffMs = arrivalDate - now;
                let diffMins = Math.ceil(diffMs / 60000);

                if (isNaN(arrivalDate.getTime())) {
                    return { text: translations[currentLang].arrNoData, timeStr: "" };
                }

                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = diffMins <= 0 ? translations[currentLang].arrArrived : `${diffMins} 分鐘`;
                return { text: text, timeStr: timeStr };
            }
        }

        async function fetchMTRData() {
            const container = document.getElementById('pinnedStationsContainer');
            
            if (pinnedList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center;"><p>${translations[currentLang].noPinnedYet}</p><p style="font-size: 13px; opacity: 0.6;">${translations[currentLang].noPinnedSub}</p></div>`;
                return;
            }

            let htmlContent = "";

            try {
                for (let item of pinnedList) {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
                    const data = await response.json();

                    htmlContent += `
                        <div class="card">
                            <button class="unpin-btn" onclick="removePin('${item.id}')" title="${translations[currentLang].unpinTitle}">❌</button>
                            <h3>📌 ${item.name}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${item.line}-${item.station}`]) {
                        const stationData = data.data[`${item.line}-${item.station}`];

                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const flTime = getStationFirstLastTime(item.line, item.station, dir);

                                htmlContent += `<div class="direction-title">往 ${destName} ${translations[currentLang].toDir}</div>`;

                                platform.slice(0, 2).forEach((train) => {
                                    const arrivalInfo = formatArrivalTime(train.time);
                                    htmlContent += `
                                        <div class="train-card-row">
                                            <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                            <span class="time-badge">${arrivalInfo.text}</span>
                                        </div>
                                    `;
                                });

                                htmlContent += `
                                    <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                        <span>🌅 ${translations[currentLang].firstTrain}: ${flTime.first}</span>
                                        <span>🌙 ${translations[currentLang].lastTrain}: ${flTime.last}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                    }

                    htmlContent += `</div>`;
                }

                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("取得港鐵數據失敗:", error);
                container.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].networkError}</p></div>`;
            }
        }

        // Autocomplete 輸入聯想功能
        function handleInputSearch(query) {
            const listContainer = document.getElementById('suggestionsList');
            const trimmed = query.trim().toLowerCase();

            if (!trimmed) {
                listContainer.style.display = 'none';
                listContainer.innerHTML = '';
                return;
            }

            let matches = [];
            for (const [lineCode, stations] of Object.entries(mtrDatabase)) {
                stations.forEach(station => {
                    if (station.name.toLowerCase().includes(trimmed)) {
                        if (!matches.some(m => m.code === station.code)) {
                            matches.push({ line: lineCode, code: station.code, name: station.name });
                        }
                    }
                });
            }

            if (matches.length > 0) {
                let html = '';
                matches.forEach(m => {
                    html += `<div class="suggestion-item" onclick="selectSuggestion('${m.line}', '${m.code}', '${m.name}')">${m.name}</div>`;
                });
                listContainer.innerHTML = html;
                listContainer.style.display = 'block';
            } else {
                listContainer.style.display = 'none';
                listContainer.innerHTML = '';
            }
        }

                            });

                            htmlContent += `
                                <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                    <span>🌅 ${translations[currentLang].firstTrain}: ${flTime.first}</span>
                                    <span>🌙 ${translations[currentLang].lastTrain}: ${flTime.last}</span>
                                </div>
                            `;
                        }
                    });

                    htmlContent += `
                        <button class="action-btn" style="margin-top: 15px;" onclick="addPin('${foundLine}', '${foundStationCode}', '${foundStationFullName}')">${translations[currentLang].addPinBtn}</button>
                    `;
                } else {
                    htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                }

                htmlContent += `</div>`;
                resultContainer.innerHTML = htmlContent;

            } catch (error) {
                resultContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].queryFailed}</p></div>`;
            }
        }

        async function searchByText() {
            const inputVal = document.getElementById('stationInputText').value.trim();
            document.getElementById('suggestionsList').style.display = 'none';

            if (!inputVal) {
                alert(translations[currentLang].alertInputStation);
                return;
            }

            let foundLine = null;
            let foundStationCode = null;
            let foundStationFullName = null;

            for (const [lineCode, stations] of Object.entries(mtrDatabase)) {
                const matched = stations.find(s => s.name.toLowerCase().includes(inputVal.toLowerCase()));
                if (matched) {
                    foundLine = lineCode;
                    foundStationCode = matched.code;
                    foundStationFullName = matched.name;
                    break;
                }
            }

            if (!foundLine) {
                alert(translations[currentLang].stationNotFound);
                return;
            }

            searchByTextSpecific(foundLine, foundStationCode, foundStationFullName);
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-wrapper')) {
                const list = document.getElementById('suggestionsList');
                if (list) list.style.display = 'none';
            }
        });

        window.onload = function() {
            const savedTheme = localStorage.getItem('mtr_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }

            const savedLang = localStorage.getItem('mtr_lang');
            if (savedLang) {
                document.getElementById('langSelect').value = savedLang;
                changeLanguage(savedLang);
            }

            loadPinnedFromStorage();
            fetchMTRData();
            setInterval(fetchMTRData, 15000);
        };
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港鐵實時資訊網 MTR Live Info</title>
    <style>
        /* 🎨 主題顏色變數設定 (6款風格) */
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #ff9800;
            --border-color: #333333;
            --header-bg: #1f1f1f;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
        }
        :root[data-theme="pink"] {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #5a3d40;
            --accent-color: #e75480;
            --border-color: #ffb6c1;
            --header-bg: #ffe4e1;
        }
        :root[data-theme="blue"] {
            --bg-color: #eef4f8;
            --card-bg: #ffffff;
            --text-color: #1a365d;
            --accent-color: #0284c7;
            --border-color: #cbd5e1;
            --header-bg: #e2e8f0;
        }
        :root[data-theme="animal"] {
            --bg-color: #f3edd5;
            --card-bg: #fffbf0;
            --text-color: #4a3b32;
            --accent-color: #558b2f;
            --border-color: #d7ccc8;
            --header-bg: #e8dfc8;
        }
        :root[data-theme="pikmin"] {
            --bg-color: #f1f8e9;
            --card-bg: #ffffff;
            --text-color: #2e7d32;
            --accent-color: #ff8f00;
            --border-color: #c8e6c9;
            --header-bg: #dcedc8;
        }

        /* 🌐 全局基本樣式 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        /* 🎨 風格選擇器下拉選單 */
        .theme-selector {
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-color);
            font-size: 14px;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleMenu()">...</button>
        <h1>🚇 港鐵實時資訊網</h1>
        <div class="auto-refresh-badge">⏱️ 15秒自動刷新</div>
    </header>

    <div class="container">
        <!-- 風格切換設定區 -->
        <div class="card theme-selector">
            <label for="themeSelect">🎨 選擇外觀風格：</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">黑色風格 (Dark)</option>
                <option value="light">白色風格 (Light)</option>
                <option value="pink">粉紅色風格 (Pink)</option>
                <option value="blue">藍色風格 (Blue)</option>
                <option value="animal">動物森友會風 (Animal Crossing)</option>
                <option value="pikmin">手繪皮克敏風 (Pikmin)</option>
            </select>
        </div>

        <!-- 測試用卡片：第一部分預告 -->
        <div class="card">
            <h3>⏱️ 第一部分：實時候車時間</h3>
            <p>（此處將會顯示即時倒數、頭班車/尾班車及 Pin 釘選功能...）</p>
        </div>

        <!-- 測試用卡片：第二部分預告 -->
        <div class="card">
            <h3>🗺️ 第二部分：轉車路線規劃</h3>
            <p>（此處將會加入港鐵互動地圖與車卡智能建議...）</p>
        </div>

        <!-- 測試用卡片：第三部分預告 -->
        <div class="card">
            <h3>🛗 第三部分：車站地面升降機指南</h3>
            <p>（此處將會加入雙軌查詢及升降機卡片...）</p>
        </div>
    </div>

    <script>
        // 切換主題風格的 JavaScript 程式碼
        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            // 順便記住使用者的選擇
            localStorage.setItem('mtr_theme', themeName);
        }

        // 讀取之前儲存過嘅主題
        window.onload = function() {
            const savedTheme = localStorage.getItem('mtr_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }
        }

        function toggleMenu() {
            alert("左上角選單功能即將推出！");
        }
    </script>

</body>
</html>

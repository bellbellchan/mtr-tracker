<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTR 婆婆友善候車導航</title>
<style>
:root { 
  --bg-color: #fbf9f4; 
  --card-bg: #ffffff; 
  --font-color: #5a4536; 
  --primary-green: #78c8a0; 
  --border-color: #e8ded1; 
} 
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
  color: var(--font-color); 
} 
body { 
  background-color: var(--bg-color); 
  padding: 16px; 
  max-width: 500px; 
  margin: 0 auto; 
  padding-bottom: 40px; 
} 
header { 
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px; 
  background-color: var(--primary-green); 
  border: 4px solid #61b38a; 
  border-radius: 24px; 
  margin-bottom: 16px; 
  box-shadow: 0 6px 0 #549f7a; 
} 
header h1 { 
  font-size: 1.3rem; 
  color: white; 
  text-shadow: 2px 2px 0px #549f7a; 
  letter-spacing: 1px; 
} 
.menu-btn {
  background: white;
  border: 2px solid #549f7a;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  color: #549f7a;
  box-shadow: 0 3px 0 #549f7a;
}
.menu-btn:active {
  transform: translateY(2px);
  box-shadow: 0 1px 0 #549f7a;
}
/* 下拉式選單 */
.dropdown-menu {
  display: none;
  background: #ffffff;
  border: 3px solid var(--border-color);
  border-radius: 18px;
  padding: 10px;
  margin-bottom: 16px;
  box-shadow: 0 4px 0 var(--border-color);
}
.dropdown-menu button {
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  background: #fcfbfa;
  border: 2px solid #f2ece4;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 6px;
  cursor: pointer;
  color: #6e5543;
}
.dropdown-menu button:hover {
  background: #f5eedc;
}
h2 { 
  font-size: 1.1rem; 
  margin-bottom: 12px; 
  display: flex; 
  align-items: center; 
  gap: 6px; 
  color: #5a4536; 
} 
.section { 
  background: var(--card-bg); 
  border: 3px solid var(--border-color); 
  border-radius: 24px; 
  padding: 18px; 
  margin-bottom: 18px; 
  box-shadow: 0 4px 0 var(--border-color); 
} 
label { 
  display: block; 
  font-size: 0.85rem; 
  font-weight: bold; 
  color: #a18e7e; 
  margin-bottom: 6px; 
} 
select, input { 
  width: 100%; 
  padding: 14px; 
  border: 2px solid var(--border-color); 
  border-radius: 16px; 
  font-size: 1rem; 
  margin-bottom: 14px; 
  background-color: #fcfbfa; 
  font-weight: bold; 
  outline: none; 
} 
button.action-btn { 
  width: 100%; 
  padding: 14px; 
  background-color: var(--primary-green); 
  color: white; 
  border: none; 
  border-radius: 18px; 
  font-size: 1rem; 
  font-weight: bold; 
  cursor: pointer; 
  box-shadow: 0 4px 0 #549f7a; 
  text-shadow: 1px 1px 0px #549f7a; 
  margin-bottom: 8px;
} 
button.action-btn:active { 
  transform: translateY(2px); 
  box-shadow: 0 2px 0 #549f7a; 
} 
.btn-pin {
  background-color: #e5a952;
  box-shadow: 0 4px 0 #c28d3f;
  text-shadow: 1px 1px 0px #c28d3f;
}
.btn-unpin {
  background-color: #e57373;
  box-shadow: 0 4px 0 #c65353;
  text-shadow: 1px 1px 0px #c65353;
  font-size: 0.8rem;
  padding: 6px 12px;
  width: auto;
  margin: 0;
}
.pinned-item {
  background: #faf6ee;
  border: 2px solid #e2d3be;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}
.pinned-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  border-bottom: 2px dashed #e5d9c5;
  padding-bottom: 8px;
}
.dir-container { 
  margin-top: 10px; 
  padding: 12px;
  background: #fdfdfd; 
  border: 2px solid #eef2e6; 
  border-radius: 14px;
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
} 
.dir-title { 
  font-size: 1.05rem; 
  font-weight: bold; 
  color: #7c624d; 
  margin-bottom: 10px; 
  background: #f5eedc; 
  padding: 6px 12px; 
  border-radius: 12px; 
  display: inline-block; 
} 
.eta-route { 
  background: #fdfdfd; 
  border: 2px solid #eef2e6; 
  padding: 12px 16px; 
  border-radius: 16px; 
  margin-bottom: 8px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
} 
.eta-time { 
  font-weight: bold; 
  font-size: 1.1rem; 
  color: #4caf50; 
} 
.eta-time.imminent { 
  color: #e57373; 
} 
.eta-time.departed { 
  color: #b5a496; 
  font-size: 0.95rem;
}
.loading { 
  text-align: center; 
  color: #a18e7e; 
  padding: 15px 0; 
  font-weight: bold; 
} 
.update-time {
  font-size: 0.7rem;
  color: #b5a496;
  text-align: right;
  margin-top: 6px;
}
.guide-card {
  background: #fffaf0;
  border: 2px solid #ebd7bc;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}
</style>
</head>
<body>

  <button class="menu-btn" onclick="toggleMenu()">…</button>
  <h1>🍃 婆婆友善 MTR 導航</h1>

<!-- 已 Pin 車站區塊 -->

<!-- ================= 頁面一：尋找車站 ================= -->

    <option value="TWL">荃灣綫</option>

    <option value="TKL">將軍澳綫</option>
    <option value="EAL">東鐵綫</option>
    <option value="TML">屯馬綫</option>
    <option value="TCL">東涌綫</option>

    <option value="KTL">觀塘綫</option>

    <option value="TWL">荃灣綫</option>
    <option value="SIL">南港島綫</option>

    <option value="TML">屯馬綫</option>
    <option value="TCL">東涌綫</option>

<!-- ================= 頁面三：升降機指南 ================= -->
<div class="section tab-content" id="tab-elevator" style="display: none;">
  <h2>🛗 功能三：升降機位置指南</h2>

<!-- 搜尋結果共用區塊 -->
<div class="section" id="result-section" style="display: none;">
  <h2 id="result-title">搜尋結果</h2>
  <div id="eta-results"></div>
</div>

<script>
const mtrData = { 
  KTL: { name: "觀塘綫", stations: { WHA:"黃埔", HOM:"何文田", YMT:"油麻地", MOK:"旺角", PRE:"太子", SKM:"石硤尾", KOT:"九龍塘", LOF:"樂富", WTS:"黃大仙", CHH:"鑽石山", KOB:"九龍灣", NTK:"牛頭角", KWT:"觀塘", LAT:"藍田", YAT:"油塘", TIK:"調景嶺" } }, 
  ISL: { name: "港島綫", stations: { KET:"堅尼地城", HKU:"香港大學", SYP:"西營盤", SHW:"上環", CEN:"中環", ADM:"金鐘", WAC:"灣仔", CWB:"銅鑼灣", TIN:"天后", FOH:"炮台山", NOP:"北角", QUB:"鰂魚涌", TAE:"太古", SWH:"西灣河", SKW:"筲箕灣", CHW:"柴灣" } }, 
  TWL: { name: "荃灣綫", stations: { CEN:"中環", ADM:"金鐘", TST:"尖沙咀", JOR:"佐敦", YMT:"油麻地", MOK:"旺角", PRE:"太子", SSP:"深水埗", CSW:"長沙灣", LCK:"荔枝角", MEF:"美孚", LAK:"荔景", KWF:"葵芳", KWH:"葵興", TWH:"大窩口", TSW:"荃灣" } }, 
  SIL: { name: "南港島綫", stations: { ADM:"金鐘", OCH:"海洋公園", WCH:"黃竹坑", LET:"利東", SOH:"海怡半島" } }, 
  TKL: { name: "將軍澳綫", stations: { NOP:"北角", QUB:"鰂魚涌", YAT:"油塘", TIK:"調景嶺", TKO:"將軍澳", LHP:"康城", KHA:"坑口", POA:"寶琳" } }, 
  EAL: { name: "東鐵綫", stations: { ADM:"金鐘", EXC:"會展", HUH:"紅磡", MKK:"旺角東", KOT:"九龍塘", TAW:"大圍", SHT:"沙田", FOT:"火炭", RAC:"馬場", UNI:"大學", TAP:"大埔墟", TWO:"太和", FAN:"粉嶺", SHS:"上水", LOW:"羅湖", LMC:"落馬洲" } }, 
  TML: { name: "屯馬綫", stations: { TUM:"屯門", SIH:"兆康", TIS:"天水圍", LFS:"朗屏", YUL:"元朗", KSR:"錦上路", TWW:"荃灣西", MEF:"美孚", NAC:"南昌", OLY:"奧運", KOW:"九龍", AUS:"柯士甸", ETS:"尖東", HOM:"何文田", TKW:"土瓜灣", SUW:"宋皇臺", CKW:"啟德", DIH:"鑽石山", HIK:"顯徑", TAW:"大圍", CKO:"車公廟", SHM:"沙田圍", CIO:"第一城", STW:"石門", TSH:"大水坑", HEO:"恆安", MOS:"馬鞍山", WKS:"烏溪沙" } }, 
  TCL: { name: "東涌綫", stations: { HOK:"香港", KOW:"九龍", OLY:"奧運", NAC:"南昌", LAK:"荔景", TSY:"青衣", SUN:"欣澳", TUC:"東涌" } }, 
  AEL: { name: "機場快綫", stations: { HOK:"香港", KOW:"九龍", TSY:"青衣", AIR:"機場", AWE:"博覽館" } } 
}; 

const destTranslation = {};
for (let lineKey in mtrData) {
  for (let code in mtrData[lineKey].stations) {
    destTranslation[code] = mtrData[lineKey].stations[code];
  }
}

// 模擬長者友善𨋢口及轉車資訊數據庫
const elevatorGuides = {
  SKM: { name: "石硤尾站", lift: "A出口側設有升降機直達大堂及地面；月台中央位置往大堂有暢通易達升降機。" },
  CSW: { name: "長沙灣站", lift: "C1及C2出口設有升降機直達地面；建議於車頭（第1卡）上落最接近大堂升降機。" },
  CEN: { name: "中環站", lift: "J出口設有大型升降機直達地面；換乘荃灣綫/港島綫建議依從藍色暢通易達標誌。" },
  ADM: { name: "金鐘站", lift: "多層架空轉線，超級大站：建議使用擴建部分（E出口方向）升降機，全路段平地或有專用垂直電梯。" },
  TST: { name: "尖沙咀站", lift: "H出口及N5出口附近設有地面升降機。" },
  MOK: { name: "旺角站", lift: "E出口（銀行中心）設有升降機直達地面。" },
  KOT: { name: "九龍塘站", lift: "G出口（又一城）設有升降機直達商場及地面，東鐵綫與觀塘綫轉線層設有專用升降機。" },
  TIN: { name: "天后站", lift: "A出口設有升降機直達地面高士威道。" },
  OCH: { name: "海洋公園站", lift: "A出口連接行人天橋及升降機直達大堂。" }
};

let refreshTimer = null;

function toggleMenu() {
  const menu = document.getElementById("nav-menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById(tabId).style.display = 'block';
  document.getElementById("nav-menu").style.display = 'none';
  document.getElementById("result-section").style.display = 'none';
}

function formatDiffText(diffSecs) { 
  if (diffSecs < -15) return "已開出 💨";
  if (diffSecs <= 15) return "已到達 🟢"; 
  const diffMins = Math.ceil(diffSecs / 60);
  if (diffMins === 1) return "1 分鐘";
  if (diffMins >= 60) { 
    return `${Math.floor(diffMins / 60)} 小時 ${diffMins % 60} 分鐘`; 
  } 
  return `${diffMins} 分鐘`; 
} 

function updateStations(lineSelectId, stationSelectId) { 
  const lineSelect = document.getElementById(lineSelectId); 
  const stationSelect = document.getElementById(stationSelectId); 
  const selectedLine = lineSelect.value; 
  stationSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>'; 
  if (selectedLine && mtrData[selectedLine]) { 
    for (const [code, name] of Object.entries(mtrData[selectedLine].stations)) { 
      const option = document.createElement("option"); 
      option.value = code; 
      option.textContent = name; 
      stationSelect.appendChild(option); 
    } 
  } 
} 

function renderSingleTrain(train, container, platformName) {
  if (!train || !train.time) return;
  const rawDestCode = train.dest; 
  const destChinese = destTranslation[rawDestCode] || rawDestCode; 
  
  const timeStr = train.time.replace(/-/g, "/"); 
  const trainTime = new Date(timeStr);
  const diffSecs = Math.floor((trainTime - new Date()) / 1000); 
  
  let timeDisplay = formatDiffText(diffSecs); 
  let extraClass = "";
  if (diffSecs <= 15 && diffSecs >= -15) extraClass = "imminent";
  else if (diffSecs < -15) extraClass = "departed";

  const dirDiv = document.createElement("div"); 
  dirDiv.className = "dir-container"; 
  dirDiv.innerHTML = `
    <div>
      <div style="font-weight:bold; font-size:0.95rem; color:#614c3b; margin-bottom:3px;">${platformName} 往 ${destChinese}</div>
      <div style="font-size:0.75rem; color:#b5a496;">月台 ${train.plat} | 預定 ${train.time.substring(11, 16)}</div>
    </div>
    <div class="eta-time ${extraClass}">${timeDisplay}</div>
  `; 
  container.appendChild(dirDiv);
}

async function fetchETA(line, station, container, isPreview, limitToOneLinePerPlatform) {
  if (isPreview) {
    container.innerHTML = '<div class="loading">💬 正在讀取班次...</div>';
  }
  try { 
    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`); 
    const data = await response.json(); 
    if (data.status === 1 && data.data[`${line}-${station}`]) { 
      const schedule = data.data[`${line}-${station}`]; 
      container.innerHTML = ""; 
      let hasData = false; 
      
      if (limitToOneLinePerPlatform) {
        if (schedule.UP && schedule.UP.length > 0) { 
          renderSingleTrain(schedule.UP[0], container, "月台 1"); 
          hasData = true; 
        } 
        if (schedule.DOWN && schedule.DOWN.length > 0) { 
          renderSingleTrain(schedule.DOWN[0], container, "月台 2"); 
          hasData = true; 
        } 
      } else {
        if (schedule.UP && schedule.UP.length > 0) { 
          renderDirectionChinese(schedule.UP, container, "月台 1"); 
          hasData = true; 
        } 
        if (schedule.DOWN && schedule.DOWN.length > 0) { 
          renderDirectionChinese(schedule.DOWN, container, "月台 2"); 
          hasData = true; 
        } 
      }
      
      if (!hasData) {
        container.innerHTML = "<div class='loading'>💤 呢個車站依家休息緊。</div>";
      } else if (!isPreview) {
        const timeDiv = document.createElement("div");
        timeDiv.className = "update-time";
        timeDiv.textContent = `最後更新: ${new Date().toTimeString().substring(0, 5)}`;
        container.appendChild(timeDiv);
      }
    } else { 
      container.innerHTML = "<div class='loading'>🌿 暫時未有此車站的班次。</div>"; 
    } 
  } catch (error) { 
    container.innerHTML = "<div class='loading'>❌ 聯絡失敗，請稍後再試。</div>"; 
  } 
} 

function fetchETAFromUI() { 
  const lineSelect = document.getElementById("line-select"); 
  const stationSelect = document.getElementById("station-select"); 
  if (!lineSelect.value || !stationSelect.value) { 
    alert("請先選擇路綫同車站！"); 
    return; 
  } 
  const resultSection = document.getElementById("result-section");
  const resultTitle = document.getElementById("result-title");
  const etaResults = document.getElementById("eta-results");
  
  resultSection.style.display = "block"; 
  resultTitle.textContent = `🍃 ${mtrData[lineSelect.value].name} ‧ ${mtrData[lineSelect.value].stations[stationSelect.value]}`; 
  fetchETA(lineSelect.value, stationSelect.value, etaResults, true, false);
}

function renderDirectionChinese(trainArray, container, platformName) {
  if (!trainArray || trainArray.length === 0) return;
  const rawDestCode = trainArray[0].dest; 
  const destChinese = destTranslation[rawDestCode] || rawDestCode; 
  
  const dirDiv = document.createElement("div"); 
  dirDiv.className = "dir-container"; 
  dirDiv.style.display = "block";
  
  const dirTitle = document.createElement("div"); 
  dirTitle.className = "dir-title"; 
  dirTitle.innerHTML = `<span>${platformName} 往 ${destChinese} 方向</span>`; 
  dirDiv.appendChild(dirTitle); 

  trainArray.forEach(train => {
    if(!train.time) return;
    const routeDiv = document.createElement("div"); 
    routeDiv.className = "eta-route"; 
    
    const timeStr = train.time.replace(/-/g, "/"); 
    const diffSecs = Math.floor((new Date(timeStr) - new Date()) / 1000); 
    let timeDisplay = formatDiffText(diffSecs); 
    let imminentClass = (diffSecs <= 15 && diffSecs >= -15) ? "imminent" : ""; 

    routeDiv.innerHTML = `
      <div class="train-detail">
        <span style="color:#8e7a68; font-weight:bold;">月台 ${train.plat}</span> &nbsp;|&nbsp; 
        <span style="color:#b5a496;">${train.time.substring(11, 16)}</span>
      </div>
      <div class="eta-time ${imminentClass}">${timeDisplay}</div>
    `; 
    dirDiv.appendChild(routeDiv); 
  });
  container.appendChild(dirDiv);
}

function pinCurrentStation() {
  const lineSelect = document.getElementById("line-select"); 
  const stationSelect = document.getElementById("station-select"); 
  if (!lineSelect.value || !stationSelect.value) { 
    alert("請先選擇想 Pin 嘅路綫同車站！"); 
    return; 
  }
  
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
  const newItem = { line: lineSelect.value, station: stationSelect.value };
  
  const exists = pinnedList.some(item => item.line === newItem.line && item.station === newItem.station);
  if (!exists) {
    pinnedList.push(newItem);
    localStorage.setItem('mtr_pinned_stations', JSON.stringify(pinnedList));
    loadPinnedStations();
    alert("成功 Pin 實此車站！");
  } else {
    alert("呢個車站已經喺已 Pin 清單入面！");
  }
}

function removePinned(line, station) {
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
  pinnedList = pinnedList.filter(item => !(item.line === line && item.station === station));
  localStorage.setItem('mtr_pinned_stations', JSON.stringify(pinnedList));
  loadPinnedStations();
}

function loadPinnedStations() {
  const pinnedSection = document.getElementById("pinned-section");
  const container = document.getElementById("pinned-container");
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');

  if (pinnedList.length === 0) {
    pinnedSection.style.display = "none";
    container.innerHTML = "";
    return;
  }

  pinnedSection.style.display = "block";
  container.innerHTML = "";

  pinnedList.forEach(item => {
    const lineName = mtrData[item.line]?.name || "";
    const stationName = mtrData[item.line]?.stations[item.station] || "";
    if(!lineName || !stationName) return;

    const itemDiv = document.createElement("div");
    itemDiv.className = "pinned-item";
    itemDiv.innerHTML = `
      <div class="pinned-header">
        <strong>${lineName} ‧ ${stationName}</strong>
        <button class="btn-unpin" onclick="removePinned('${item.line}', '${item.station}')">✖ 取消 Pin</button>
      </div>
      <div id="pin-content-${item.line}-${item.station}">
        <div class="loading">💬 讀取中...</div>
      </div>
    `;
    container.appendChild(itemDiv);
    fetchETA(item.line, item.station, document.getElementById(`pin-content-${item.line}-${item.station}`), false, true);
  });
}

async function calcRouteFromUI() {
  const srcLine = document.getElementById("src-line-select").value;
  const srcStation = document.getElementById("src-station-select").value;
  const destLine = document.getElementById("dest-line-select").value;
  const destStation = document.getElementById("dest-station-select").value;

  if (!srcLine || !srcStation) {
    alert("請選擇出發車站！");
    return;
  }
  if (!destLine || !destStation) {
    alert("請選擇目的地車站！");
    return;
  }

  const resultSection = document.getElementById("result-section");
  const resultTitle = document.getElementById("result-title");
  const etaResults = document.getElementById("eta-results");

  resultSection.style.display = "block";
  const srcName = mtrData[srcLine].stations[srcStation];
  const destName = mtrData[destLine].stations[destStation];
  resultTitle.textContent = `🎯 由 ${srcName} 去 ${destName}`;
  etaResults.innerHTML = '<div class="loading">💬 正在分析最快路線與無障礙資訊...</div>';

  try {
    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${srcLine}&sta=${srcStation}`);
    const data = await response.json();
    
    // 取得目的地升降機指引
    const destLiftInfo = elevatorGuides[destStation]?.lift || "建議留意站內「暢通易達」升降機指示標誌或向站務員查詢。";
    const srcLiftInfo = elevatorGuides[srcStation]?.lift || "出發站大堂設有升降機。";

    if (data.status === 1 && data.data[`${srcLine}-${srcStation}`]) {
      const schedule = data.data[`${srcLine}-${srcStation}`];
      etaResults.innerHTML = "";
      
      let allTrains = [];
      if (schedule.UP) allTrains = allTrains.concat(schedule.UP);
      if (schedule.DOWN) allTrains = allTrains.concat(schedule.DOWN);

      if (allTrains.length === 0) {
        etaResults.innerHTML = "<div class='loading'>💤 該出發車站目前沒有班次。</div>";
        return;
      }

      allTrains.sort((a, b) => new Date(a.time.replace(/-/g, "/")) - new Date(b.time.replace(/-/g, "/")));
      const fastestTrain = allTrains[0];

      const rawDestCode = fastestTrain.dest;
      const trainDestName = destTranslation[rawDestCode] || rawDestCode;
      const timeStr = fastestTrain.time.replace(/-/g, "/");
      const diffSecs = Math.floor((new Date(timeStr) - new Date()) / 1000);
      let timeDisplay = formatDiffText(diffSecs);
      let imminentClass = (diffSecs <= 15 && diffSecs >= -15) ? "imminent" : "";

      let transferHtml = "";
      if (srcLine !== destLine) {
        transferHtml = `<div style="margin-top:8px; font-size:0.85rem; color:#d97706; background:#fef3c7; padding:8px; border-radius:10px;">⚠️ 提示：需要轉線（建議於金鐘或旺角等大型轉線站轉乘，請留意站內廣播）。</div>`;
      } else {
        transferHtml = `<div style="margin-top:8px; font-size:0.85rem; color:#059669; background:#d1fae5; padding:8px; border-radius:10px;">✨ 直達路線，無需轉線！</div>`;
      }

      etaResults.innerHTML = `
        <div class="dir-container" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:bold; font-size:1rem; color:#614c3b; margin-bottom:4px;">推薦乘搭月台 ${fastestTrain.plat}</div>
            <div style="font-size:0.85rem; color:#8e7a68;">往 ${trainDestName} 方向 (預定 ${fastestTrain.time.substring(11, 16)})</div>
          </div>
          <div class="eta-time ${imminentClass}">${timeDisplay}</div>
        </div>
        ${transferHtml}
        <div class="guide-card" style="margin-top:12px;">
          <div style="font-weight:bold; margin-bottom:4px;">🛗 婆婆出行貼心提示：</div>
          <div style="font-size:0.85rem; line-height:1.4; color:#6e5543;">
            • <b>出發站（${srcName}）：</b>${srcLiftInfo}<br>
            • <b>目的地（${destName}）：</b>${destLiftInfo}
          </div>
        </div>
      `;
    } else {
      etaResults.innerHTML = "<div class='loading'>🌿 暫時未能獲取出發站班次資料。</div>";
    }
  } catch (err) {
    etaResults.innerHTML = "<div class='loading'>❌ 計算路線失敗，請稍後再試。</div>";
  }
}

function showElevatorGuide() {
  const code = document.getElementById("guide-station-select").value;
  const container = document.getElementById("elevator-guide-result");
  if (!code || !elevatorGuides[code]) {
    container.innerHTML = '<div class="loading">請選擇上方車站查看𨋢口位置</div>';
    return;
  }
  const info = elevatorGuides[code];
  container.innerHTML = `
    <div class="guide-card">
      <div style="font-weight:bold; font-size:1.05rem; margin-bottom:6px; color:#5a4536;">🏢 ${info.name}</div>
      <div style="font-size:0.9rem; line-height:1.5; color:#6e5543;">${info.lift}</div>
    </div>
  `;
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
    pinnedList.forEach(item => {
      const contentEl = document.getElementById(`pin-content-${item.line}-${item.station}`);
      if (contentEl) {
        fetchETA(item.line, item.station, contentEl, false, true);
      }
    });
  }, 15000);
}

window.addEventListener('DOMContentLoaded', () => {
  loadPinnedStations();
  startAutoRefresh();
});
</script>

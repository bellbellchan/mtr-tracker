<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港鐵全綫實時資訊網 MTR Live Info (下拉與地圖並存版)</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #38bdf8;
            --border-color: #333333;
            --header-bg: #1f1f1f;
            --row-bg: #252525;
            --map-bg: #0b132b;
            --map-text: #ffffff;
            --map-label-bg: rgba(11, 19, 43, 0.85);
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
            --row-bg: #f9f9fb;
            --map-bg: #eef2f7;
            --map-text: #333333;
            --map-label-bg: rgba(255, 255, 255, 0.9);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1500;
        }
        .overlay.show {
            display: block;
        }

        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        .train-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 14px;
        }

        .direction-title {
            background-color: var(--row-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 12px 0 8px 0;
            font-size: 14px;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }

        .train-card-row {
            background-color: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .time-badge {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .unpin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 10px;
        }

        label {
            font-size: 13px;
            display: block;
            margin-bottom: 5px;
            opacity: 0.9;
        }

        .mode-switch-tabs {
            display: flex;
            background-color: var(--row-bg);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }
        .mode-tab {
            flex: 1;
            text-align: center;
            padding: 8px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }
        .mode-tab.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .map-viewport {
            width: 100%;
            height: 450px;
            background-color: var(--map-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: auto;
            position: relative;
            -webkit-overflow-scrolling: touch;
            touch-action: pan-x pan-y pinch-zoom;
            margin-bottom: 10px;
        }

        .map-canvas {
            width: 2200px;
            height: 1600px;
            position: relative;
            background-color: var(--map-bg);
        }

        .map-station-dot {
            position: absolute;
            width: 12px;
            height: 12px;
            background-color: var(--card-bg);
            border: 2.5px solid var(--accent-color);
            border-radius: 50%;
            cursor: pointer;
            transform: translate(-50%, -50%);
            z-index: 10;
        }

        .map-station-label {
            position: absolute;
            font-size: 11px;
            font-weight: bold;
            color: var(--map-text);
            background: var(--map-label-bg);
            padding: 1px 4px;
            border-radius: 3px;
            white-space: nowrap;
            transform: translate(-50%, 12px);
            pointer-events: none;
            border: 1px solid var(--border-color);
            z-index: 11;
        }

        .map-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            font-size: 12px;
        }
        .zoom-btn-group button {
            background-color: var(--row-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 4px;
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">...</button>
        <h1 id="headerTitle">⭐ 我的釘選站 (Pinned)</h1>
        <div class="auto-refresh-badge">⏱️ 15s</div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>🧭 導航選單</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="menu-item active" onclick="switchPage('pinned', '⭐ 我的釘選站 (Pinned)', this)">⭐ 實時候車時間 (已Pin)</div>
        <div class="menu-item" onclick="switchPage('search', '🔍 搜尋全港車站', this)">🔍 搜尋全港車站</div>
    </div>

    <div class="container">

        <!-- 頁面 1：釘選站 -->
        <div id="page-pinned" class="page-content active">
            <div id="pinnedStationsContainer">
                <div class="card"><p style="text-align: center;">⏳ 正在向港鐵系統取得實時數據...</p></div>
            </div>
            <p style="text-align: center; font-size: 12px; opacity: 0.6;">💡 提示：畫面每 15 秒會在背景自動更新一次。</p>
        </div>

        <!-- 頁面 2：搜尋車站 (下拉選單 + 地圖雙模式) -->
        <div id="page-search" class="page-content">
            <div class="card" style="padding: 12px;">
                <h3 style="margin-top: 5px; font-size: 15px;">🔍 搜尋全港車站</h3>
                
                <div class="mode-switch-tabs">
                    <div id="tabDropdown" class="mode-tab active" onclick="switchSearchMode('dropdown')">📋 下拉清單選站</div>
                    <div id="tabMap" class="mode-tab" onclick="switchSearchMode('map')">🗺️ 港鐵互動地圖</div>
                </div>

                <!-- 下拉清單模式 -->
                <div id="sectionDropdown">
                    <label for="lineSelect">選擇鐵路綫：</label>
                    <select id="lineSelect" onchange="updateStationOptions()">
                        <option value="" disabled selected>-- 請選擇鐵路綫 --</option>
                        <option value="TWL">荃灣綫 (TWL)</option>
                        <option value="ISL">港島綫 (ISL)</option>
                        <option value="KTL">觀塘綫 (KTL)</option>
                        <option value="EAL">東鐵綫 (EAL)</option>
                        <option value="TML">屯馬綫 (TML)</option>
                        <option value="SIL">南港島綫 (SIL)</option>
                        <option value="TCL">東涌綫 (TCL)</option>
                        <option value="TKL">將軍澳綫 (TKL)</option>
                        <option value="AEL">機場快綫 (AEL)</option>
                        <option value="DRL">迪士尼綫 (DRL)</option>
                    </select>

                    <label for="stationSelect">選擇車站：</label>
                    <select id="stationSelect">
                        <option value="" disabled selected>-- 請先選擇鐵路綫 --</option>
                    </select>

                    <button class="action-btn" onclick="searchStationTimeFromDropdown()">立即查詢實時資料</button>
                </div>

                <!-- 互動地圖模式 -->
                <div id="sectionMap" style="display: none;">
                    <div class="map-controls">
                        <span style="opacity: 0.8; font-size: 11px;">👆 點擊車站直接查看</span>
                        <div class="zoom-btn-group">
                            <button onclick="adjustZoom(0.15)">➕ 放大</button>
                            <button onclick="adjustZoom(-0.15)">➖ 縮小</button>
                        </div>
                    </div>

                    <div class="map-viewport">
                        <div class="map-canvas" id="mapCanvas">
                            <svg style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;">
                                <path d="M 250,900 L 1400,900" stroke="#0072bc" stroke-width="4" fill="none"/>
                                <path d="M 950,900 L 950,1150 L 1150,1350" stroke="#b6bd00" stroke-width="4" fill="none"/>
                                <path d="M 200,500 L 500,500 L 800,650 L 950,900 L 750,900" stroke="#e2231a" stroke-width="4" fill="none"/>
                                <path d="M 1100,750 L 950,650 L 1250,650 L 1600,850" stroke="#00a94f" stroke-width="4" fill="none"/>
                                <path d="M 1450,150 L 1450,500 L 1250,650 L 1050,800 L 950,900" stroke="#00aeae" stroke-width="4" fill="none"/>
                            </svg>

                            <!-- 部分核心站點範例 -->
                            <div class="map-station-dot" style="top: 900px; left: 950px;" onclick="searchStationTime('ISL', 'ADM', '金鐘')"><span class="map-station-label">金鐘</span></div>
                            <div class="map-station-dot" style="top: 900px; left: 850px;" onclick="searchStationTime('ISL', 'CEN', '中環')"><span class="map-station-label">中環</span></div>
                            <div class="map-station-dot" style="top: 900px; left: 910px;" onclick="searchStationTime('TWL', 'PRE', '太子')"><span class="map-station-label">太子</span></div>
                            <div class="map-station-dot" style="top: 650px; left: 950px;" onclick="searchStationTime('KTL', 'KOT', '九龍塘')"><span class="map-station-label">九龍塘</span></div>
                            <div class="map-station-dot" style="top: 500px; left: 200px;" onclick="searchStationTime('TWL', 'TSW', '荃灣')"><span class="map-station-label">荃灣</span></div>
                        </div>
                    </div>
                </div>

            </div>

            <div id="searchResultContainer"></div>
        </div>

    </div>

    <script>
        const mtrDatabase = {
            "TWL": [{ code: "TSW", name: "荃灣" }, { code: "MEF", name: "美孚" }, { code: "PRE", name: "太子" }, { code: "MOK", name: "旺角" }, { code: "TST", name: "尖沙咀" }, { code: "ADM", name: "金鐘" }, { code: "CEN", name: "中環" }],
            "ISL": [{ code: "KET", name: "堅尼地城" }, { code: "CEN", name: "中環" }, { code: "ADM", name: "金鐘" }, { code: "WAC", name: "灣仔" }, { code: "CAB", name: "銅鑼灣" }, { code: "NOP", name: "北角" }, { code: "CHW", name: "柴灣" }],
            "KTL": [{ code: "WHA", name: "黃埔" }, { code: "MOK", name: "旺角" }, { code: "PRE", name: "太子" }, { code: "KOT", name: "九龍塘" }, { code: "DIH", name: "鑽石山" }, { code: "TIK", name: "調景嶺" }],
            "EAL": [{ code: "LOW", name: "羅湖" }, { code: "SHT", name: "沙田" }, { code: "TAK", name: "大圍" }, { code: "KOT", name: "九龍塘" }, { code: "HUH", name: "紅磡" }, { code: "ADM", name: "金鐘" }],
            "TML": [{ code: "TUM", name: "屯門" }, { code: "MEF", name: "美孚" }, { code: "HUH", name: "紅磡" }, { code: "TAK", name: "大圍" }, { code: "WKS", name: "烏溪沙" }],
            "SIL": [{ code: "ADM", name: "金鐘" }, { code: "OCP", name: "海洋公園" }, { code: "SOH", name: "海怡半島" }],
            "TCL": [{ code: "TUC", name: "東涌" }, { code: "TSY", name: "青衣" }, { code: "NAC", name: "南昌" }, { code: "HOK", name: "香港" }],
            "TKL": [{ code: "NOP", name: "北角" }, { code: "TIK", name: "調景嶺" }, { code: "POA", name: "寶琳" }],
            "AEL": [{ code: "AWE", name: "博覽館" }, { code: "TSY", name: "青衣" }, { code: "HOK", name: "香港" }],
            "DRL": [{ code: "SUN", name: "欣澳" }, { code: "DIS", name: "迪士尼" }]
        };

        let pinnedList = [];
        let currentScale = 1.0;

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function switchPage(pageId, titleText, element) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('headerTitle').innerText = titleText;
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(element) element.classList.add('active');
            toggleSidebar();
            if (pageId === 'pinned') fetchMTRData();
        }

        function switchSearchMode(mode) {
            const tabDropdown = document.getElementById('tabDropdown');
            const tabMap = document.getElementById('tabMap');
            const sectionDropdown = document.getElementById('sectionDropdown');
            const sectionMap = document.getElementById('sectionMap');

            if (mode === 'dropdown') {
                tabDropdown.classList.add('active');
                tabMap.classList.remove('active');
                sectionDropdown.style.display = 'block';
                sectionMap.style.display = 'none';
            } else {
                tabMap.classList.add('active');
                tabDropdown.classList.remove('active');
                sectionDropdown.style.display = 'none';
                sectionMap.style.display = 'block';
            }
        }

        function updateStationOptions() {
            const lineSelect = document.getElementById('lineSelect').value;
            const stationSelect = document.getElementById('stationSelect');
            stationSelect.innerHTML = `<option value="" disabled selected>-- 請選擇車站 --</option>`;

            if (mtrDatabase[lineSelect]) {
                mtrDatabase[lineSelect].forEach(station => {
                    let opt = document.createElement('option');
                    opt.value = station.code;
                    opt.text = station.name;
                    stationSelect.appendChild(opt);
                });
            }
        }

        function searchStationTimeFromDropdown() {
            const line = document.getElementById('lineSelect').value;
            const stationCode = document.getElementById('stationSelect').value;
            if (!line || !stationCode) {
                alert("⚠️ 請先選擇鐵路綫及車站！");
                return;
            }
            const stationDropdown = document.getElementById('stationSelect');
            const stationFullName = stationDropdown.options[stationDropdown.selectedIndex].text;
            searchStationTime(line, stationCode, stationFullName);
        }

        function adjustZoom(amount) {
            currentScale += amount;
            if (currentScale < 0.5) currentScale = 0.5;
            if (currentScale > 2.0) currentScale = 2.0;
            document.getElementById('mapCanvas').style.transform = `scale(${currentScale})`;
            document.getElementById('mapCanvas').style.transformOrigin = 'top left';
        }

        function removePin(id) {
            pinnedList = pinnedList.filter(item => item.id !== id);
            fetchMTRData();
        }

        function addPin(line, stationCode, stationFullName) {
            const newId = `${line}-${stationCode}`;
            if (!pinnedList.some(item => item.id === newId)) {
                pinnedList.push({ id: newId, line: line, station: stationCode, name: stationFullName });
                alert("⭐ 成功加入釘選站！");
                fetchMTRData();
            } else {
                alert("💡 呢個站已經喺你的釘選列表入面！");
            }
        }

        function translateDestination(destCode) {
            const destMap = {
                "CEN": "中環", "TSW": "荃灣", "CHW": "柴灣", "KET": "堅尼地城",
                "NOP": "北角", "WHA": "黃埔", "TIK": "調景嶺", "LOW": "羅湖",
                "LMC": "落馬洲", "ADM": "金鐘", "AWE": "博覽館", "HOK": "香港",
                "SOH": "海怡半島", "TUC": "東涌", "POA": "寶琳", "DIS": "迪士尼"
            };
            return destMap[destCode] || destCode;
        }

        function formatArrivalTime(rawTime) {
            if (rawTime === undefined || rawTime === null) return { text: "暫無資料", timeStr: "" };
            let now = new Date();
            let num = Number(rawTime);
            if (!isNaN(num)) {
                let arrivalDate = new Date(now.getTime() + num * 60000);
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let text = num <= 0 ? "已到達" : `${num} 分鐘`;
                return { text: text, timeStr: `${hours}:${minutes}` };
            }
            return { text: "暫無資料", timeStr: "" };
        }

        async function fetchMTRData() {
            const container = document.getElementById('pinnedStationsContainer');
            if (pinnedList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center;"><p>⭐ 你目前未有任何釘選站！</p><p style="font-size: 13px; opacity: 0.6;">去「搜尋全港車站」用下拉清單加返個站落嚟～</p></div>`;
                return;
            }

            let htmlContent = "";
            try {
                for (let item of pinnedList) {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
                    const data = await response.json();

                    htmlContent += `
                        <div class="card">
                            <button class="unpin-btn" onclick="removePin('${item.id}')">❌</button>
                            <h3>📌 ${item.name}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${item.line}-${item.station}`]) {
                        const stationData = data.data[`${item.line}-${item.station}`];
                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const arrivalInfo = formatArrivalTime(platform[0].time);
                                htmlContent += `
                                    <div class="train-row">
                                        <span><strong>往 ${destName} 方向</strong> <span style="opacity: 0.8; font-size: 13px; margin-left: 6px; color: var(--accent-color);">${arrivalInfo.timeStr}</span></span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        htmlContent += `<p style="font-size: 13px; opacity: 0.7;">暫時無法取得實時數據</p>`;
                    }
                    htmlContent += `</div>`;
                }
                container.innerHTML = htmlContent;
            } catch (error) {
                container.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">⚠️ 網絡連接錯誤</p></div>`;
            }
        }

        async function searchStationTime(line, stationCode, stationFullName) {
            const resultContainer = document.getElementById('searchResultContainer');
            resultContainer.innerHTML = `<div class="card"><p style="text-align: center;">⏳ 正在查詢 ${stationFullName} 實時資料...</p></div>`;

            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${stationCode}`);
                const data = await response.json();

                let htmlContent = `
                    <div class="card">
                        <h3>🔍 ${stationFullName} 實時候車時間</h3>
                `;

                if (data.status === 1 && data.data && data.data[`${line}-${stationCode}`]) {
                    const stationData = data.data[`${line}-${stationCode}`];
                    ['UP', 'DOWN'].forEach(dir => {
                        if (stationData[dir] && stationData[dir].length > 0) {
                            const platform = stationData[dir];
                            const destName = translateDestination(platform[0].dest);

                            htmlContent += `<div class="direction-title">往 ${destName} 方向</div>`;
                            platform.slice(0, 3).forEach((train) => {
                                const arrivalInfo = formatArrivalTime(train.time);
                                htmlContent += `
                                    <div class="train-card-row">
                                        <span>預定時間：${arrivalInfo.timeStr}</span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            });
                        }
                    });

                    htmlContent += `
                        <button class="action-btn" onclick="addPin('${line}', '${stationCode}', '${stationFullName}')">⭐ 將此站加入釘選 (Pin)</button>
                    `;
                } else {
                    htmlContent += `<p style="font-size: 13px; opacity: 0.7;">暫時無法取得該車站實時數據</p>`;
                }

                htmlContent += `</div>`;
                resultContainer.innerHTML = htmlContent;
            } catch (error) {
                resultContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">⚠️ 查詢失敗。</p></div>`;
            }
        }

        window.onload = function() {
            fetchMTRData();
            setInterval(fetchMTRData, 15000);
        };
    </script>
</body>
</html>

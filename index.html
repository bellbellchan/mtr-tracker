<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR候車時間</title>
    <style>
        :root { --bg-color: #fbf9f4; --card-bg: #ffffff; --font-color: #6e5543; --primary-green: #78c8a0; --border-color: #e8ded1; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--font-color); }
        body { background-color: var(--bg-color); padding: 16px; max-width: 500px; margin: 0 auto; padding-bottom: 40px; }
        header { text-align: center; padding: 20px 0; background-color: var(--primary-green); border: 4px solid #61b38a; border-radius: 24px; margin-bottom: 16px; box-shadow: 0 6px 0 #549f7a; }
        header h1 { font-size: 1.5rem; color: white; text-shadow: 2px 2px 0px #549f7a; letter-spacing: 2px; }
        h2 { font-size: 1.1rem; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; color: #5a4536; }
        .section { background: var(--card-bg); border: 3px solid var(--border-color); border-radius: 24px; padding: 18px; margin-bottom: 18px; box-shadow: 0 4px 0 var(--border-color); }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: #a18e7e; margin-bottom: 6px; }
        select { width: 100%; padding: 14px; border: 2px solid var(--border-color); border-radius: 16px; font-size: 1rem; margin-bottom: 14px; background-color: #fcfbfa; font-weight: bold; outline: none; }
        button { width: 100%; padding: 14px; background-color: var(--primary-green); color: white; border: none; border-radius: 18px; font-size: 1rem; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #549f7a; text-shadow: 1px 1px 0px #549f7a; }
        button:active { transform: translateY(2px); box-shadow: 0 2px 0 #549f7a; }
        .dir-container { margin-top: 16px; padding-bottom: 8px; }
        .dir-title { font-size: 1.05rem; font-weight: bold; color: #7c624d; margin-bottom: 10px; background: #f5eedc; padding: 6px 12px; border-radius: 12px; display: inline-block; }
        .eta-route { background: #fdfdfd; border: 2px solid #eef2e6; padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .eta-time { font-weight: bold; font-size: 1.1rem; color: #4caf50; }
        .eta-time.imminent { color: #e57373; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }
        .loading { text-align: center; color: #a18e7e; padding: 20px 0; font-weight: bold; }
    </style>
</head>
<body>
<header><h1>🍃 MTR候車時間</h1></header>
<div class="section">
    <h2>🔍 選擇車站</h2>
    <label>鐵路綫</label>
    <select id="line-select" onchange="updateStations()">
        <option value="">-- 請選擇鐵路綫 --</option>
        <option value="KTL">觀塘綫</option><option value="ISL">港島綫</option><option value="TWL">荃灣綫</option>
        <option value="SIL">南港島綫</option><option value="TKL">將軍澳綫</option><option value="EAL">東鐵綫</option>
        <option value="TML">屯馬綫</option><option value="TCL">東涌綫</option><option value="AEL">機場快綫</option>
    </select>
    <label>車站</label>
    <select id="station-select"><option value="">-- 請先選擇鐵路綫 --</option></select>
    <button onclick="startMonitoring()">開始監測 (每15秒更新)</button>
</div>
<div class="section" id="result-section" style="display: none;">
    <h2 id="result-title">班次時間</h2>
    <div id="eta-results"></div>
</div>

<script>
// 儲存當前監測狀態
let currentMonitor = { line: null, sta: null, staName: null, lineName: null };
let refreshInterval = null;

/* ... (原本的 mtrData 與 destTranslation 物件保持不變，請保留你原有的內容) ... */
const mtrData = { /* 略，與你提供的代碼一致 */ };
const destTranslation = { /* 略，與你提供的代碼一致 */ };

function updateStations() { /* ... 與你提供的代碼一致 ... */ }

function startMonitoring() {
    const lineSelect = document.getElementById("line-select");
    const stationSelect = document.getElementById("station-select");
    if (!lineSelect.value || !stationSelect.value) { alert("請先選擇路綫同車站！"); return; }
    
    // 設定監測參數
    currentMonitor.line = lineSelect.value;
    currentMonitor.sta = stationSelect.value;
    currentMonitor.staName = mtrData[currentMonitor.line].stations[currentMonitor.sta];
    currentMonitor.lineName = mtrData[currentMonitor.line].name;
    
    // 執行第一次抓取並設定循環
    fetchETA(currentMonitor.line, currentMonitor.sta, currentMonitor.staName, currentMonitor.lineName);
    if(refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
        fetchETA(currentMonitor.line, currentMonitor.sta, currentMonitor.staName, currentMonitor.lineName, true);
    }, 15000);
}

// 修改 fetchETA，加入 silent 參數以避免自動刷新時 UI 頻繁閃爍
async function fetchETA(line, station, stationName, lineName, isSilent = false) {
    const resultSection = document.getElementById("result-section");
    const etaResults = document.getElementById("eta-results");
    const resultTitle = document.getElementById("result-title");
    
    resultSection.style.display = "block";
    resultTitle.textContent = `🍃 ${lineName} ‧ ${stationName}`;
    
    if(!isSilent) etaResults.innerHTML = '<div class="loading">💬 正在聯繫鐵路綫...</div>';
    
    try {
        const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`);
        const data = await response.json();
        if (data.status === 1 && data.data[`${line}-${station}`]) {
            const schedule = data.data[`${line}-${station}`];
            etaResults.innerHTML = "";
            let hasData = false;
            if (schedule.UP && schedule.UP.length > 0) { renderDirectionChinese(schedule.UP, etaResults); hasData = true; }
            if (schedule.DOWN && schedule.DOWN.length > 0) { renderDirectionChinese(schedule.DOWN, etaResults); hasData = true; }
            if (!hasData) etaResults.innerHTML = "<div class='loading'>💤 呢個車站依家休息緊。</div>";
        }
    } catch (error) { if(!isSilent) etaResults.innerHTML = "<div class='loading'>❌ 聯繫失敗，請稍後再試。</div>"; }
}

/* ... (renderDirectionChinese, formatDiffText 等函數保持不變) ... */
</script>
</body>
</html>

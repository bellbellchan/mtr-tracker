<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MTR Pro 導航</title>
    <style>
        :root { --green: #007934; --bg: #fdfdfd; }
        body { font-family: sans-serif; background: var(--bg); margin: 0; padding: 15px; }
        header { display: flex; align-items: center; background: var(--green); color: white; padding: 10px; border-radius: 12px; }
        .menu { font-size: 24px; margin-right: 15px; cursor: pointer; }
        #menu-content { display: none; background: white; border: 1px solid #ccc; padding: 10px; border-radius: 8px; margin-top: 5px; }
        .card { background: white; border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-top: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .train-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .imminent { color: #d32f2f; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="menu" onclick="document.getElementById('menu-content').style.display = (document.getElementById('menu-content').style.display === 'block' ? 'none' : 'block')">…</div>
    <div>MTR 系統</div>
</header>

<div id="menu-content">
    <button onclick="changeMode('time')">1. 車站到達時間</button>
    <button onclick="changeMode('transfer')">2. 轉車路徑/車卡</button>
    <button onclick="changeMode('lift')">3. 地面升降機位置</button>
</div>

<div id="app" class="card">
    <!-- 動態渲染區 -->
</div>

<script>
// 補全資料庫
const STATION_DB = {
    "TIN": { name: "天后", lift: "月台尾(6卡)", suggest: "第 5-6 卡" },
    "OCH": { name: "海洋公園", lift: "月台中央(3卡)", suggest: "第 3-4 卡" }
};

let currentMode = 'time';

async function refreshData() {
    if (currentMode !== 'time') return;
    // 這裡放入原有的 API 請求邏輯，並確保使用 Math.max(0, ...) 處理時間
}

// 時間處理邏輯修正
function formatTime(t) {
    const diff = Math.floor((new Date(t.replace(/-/g, "/")) - new Date()) / 60000);
    return diff <= 0 ? "已到達" : diff + " 分鐘";
}

function changeMode(m) {
    currentMode = m;
    const app = document.getElementById('app');
    if (m === 'lift') {
        app.innerHTML = "<h3>地面升降機指南</h3><p>天后站：B出口旁升降機。</p><p>海洋公園：海怡方向月台電梯。</p>";
    } else if (m === 'transfer') {
        app.innerHTML = "<h3>轉車建議</h3><p>請搜尋路線以獲取車卡建議。</p>";
    } else {
        app.innerHTML = "請選擇車站...";
    }
    document.getElementById('menu-content').style.display = 'none';
}

// 設定 30 秒自動刷新
setInterval(refreshData, 30000);
</script>
</body>
</html>

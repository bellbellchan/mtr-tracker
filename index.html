<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTR 實時班次</title>
<style>
    body { font-family: sans-serif; background: #fbf9f4; padding: 20px; color: #5a4536; }
    .card { background: #fff; border: 2px solid #e8ded1; border-radius: 20px; padding: 20px; margin-bottom: 20px; }
    h2 { font-size: 1.1rem; margin-bottom: 15px; color: #6e5543; }
    select, button { width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 12px; border: 2px solid #e8ded1; font-weight: bold; }
    button { background: #78c8a0; color: white; border: none; cursor: pointer; }
    .plat-box { margin-top: 15px; }
    .plat-title { background: #f0e6d2; padding: 5px 10px; border-radius: 6px; font-size: 0.85rem; font-weight: bold; display: inline-block; margin-bottom: 5px; }
    .train-item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; font-size: 0.95rem; }
    .time-val { font-weight: bold; color: #4caf50; }
    .departed { color: #b5a496; }
    .btn-del { background: #e57373; font-size: 0.7rem; padding: 5px 10px; }
</style>
</head>
<body>

<div class="card" id="pinned-section">
    <h2>📌 我的車站</h2>
    <div id="pinned-list"></div>
</div>

<div class="card">
    <h2>🔍 查詢班次</h2>
    <select id="line-sel" onchange="updateStationOptions()">
        <option value="">選擇路線</option>
        <option value="KTL">觀塘綫</option>
        <option value="ISL">港島綫</option>
        <option value="TWL">荃灣綫</option>
        <option value="EAL">東鐵綫</option>
        <option value="TML">屯馬綫</option>
    </select>
    <select id="sta-sel"><option value="">請先選路線</option></select>
    <button onclick="addPin()">Pin 實呢個站</button>
    <div id="result-area"></div>
</div>

<script>
const stations = {
    KTL: {WHA:"黃埔", HOM:"何文田", TIK:"調景嶺", KWT:"觀塘"},
    ISL: {KET:"堅尼地城", CEN:"中環", TIN:"天后", CHW:"柴灣"},
    TWL: {CEN:"中環", TST:"尖沙咀", TSW:"荃灣"},
    EAL: {ADM:"金鐘", HUH:"紅磡", TAP:"大埔墟", SHS:"上水"},
    TML: {TUM:"屯門", YUL:"元朗", MEF:"美孚", TAW:"大圍", MOS:"馬鞍山"}
};

// 簡單翻譯表
const trans = { "WHA":"黃埔", "HOM":"何文田", "TIK":"調景嶺", "KWT":"觀塘", "KET":"堅尼地城", "CEN":"中環", "TIN":"天后", "CHW":"柴灣", "TST":"尖沙咀", "TSW":"荃灣", "ADM":"金鐘", "HUH":"紅磡", "TAP":"大埔墟", "SHS":"上水", "TUM":"屯門", "YUL":"元朗", "MEF":"美孚", "TAW":"大圍", "MOS":"馬鞍山" };

function updateStationOptions() {
    const line = document.getElementById('line-sel').value;
    const sel = document.getElementById('sta-sel');
    sel.innerHTML = '<option value="">選擇車站</option>';
    if(stations[line]) {
        for(let code in stations[line]) {
            sel.innerHTML += `<option value="${code}">${stations[line][code]}</option>`;
        }
    }
}

async function fetchMTR(line, sta, container) {
    container.innerHTML = "讀取中...";
    try {
        let res = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${sta}`);
        let json = await res.json();
        if(json.status !== 1) { container.innerHTML = "暫無資料"; return; }
        
        container.innerHTML = "";
        let data = json.data[`${line}-${sta}`];
        renderPlat(data.UP, container, "月台 1");
        renderPlat(data.DOWN, container, "月台 2");
    } catch(e) { container.innerHTML = "連接錯誤"; }
}

function renderPlat(list, container, title) {
    if(!list || list.length === 0) return;
    let box = document.createElement('div');
    box.className = 'plat-box';
    box.innerHTML = `<div class="plat-title">${title}</div>`;
    list.forEach(t => {
        let now = new Date();
        let tTime = new Date(t.time.replace(/-/g, "/"));
        let diff = Math.floor((tTime - now) / 60000);
        let timeTxt = diff < 0 ? "已開出" : (diff <= 1 ? "已到站" : diff + " 分鐘");
        box.innerHTML += `<div class="train-item"><span>往 ${trans[t.dest] || t.dest}</span><span class="time-val ${diff < 0 ? 'departed':''}">${timeTxt}</span></div>`;
    });
    container.appendChild(box);
}

function addPin() {
    let line = document.getElementById('line-sel').value;
    let sta = document.getElementById('sta-sel').value;
    if(!line || !sta) return;
    let pins = JSON.parse(localStorage.getItem('pins') || '[]');
    if(!pins.find(p => p.line==line && p.sta==sta)) {
        pins.push({line, sta});
        localStorage.setItem('pins', JSON.stringify(pins));
        loadPins();
    }
}

function loadPins() {
    let list = document.getElementById('pinned-list');
    list.innerHTML = "";
    JSON.parse(localStorage.getItem('pins') || '[]').forEach(p => {
        let div = document.createElement('div');
        div.innerHTML = `<strong>${stations[p.line][p.sta]}</strong> <button class="btn-del" onclick="delPin('${p.line}', '${p.sta}')">取消</button><div id="p-${p.line}-${p.sta}"></div>`;
        list.appendChild(div);
        fetchMTR(p.line, p.sta, document.getElementById(`p-${p.line}-${p.sta}`));
    });
}

function delPin(line, sta) {
    let pins = JSON.parse(localStorage.getItem('pins') || '[]').filter(p => !(p.line==line && p.sta==sta));
    localStorage.setItem('pins', JSON.stringify(pins));
    loadPins();
}

loadPins();
</script>
</body>
</html>

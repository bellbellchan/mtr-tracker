        /* 🎨 主題顏色變數設定 (5款精選風格) */
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #38bdf8;
            --border-color: #333333;
            --header-bg: #1f1f1f;
            --row-bg: #252525;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
            --row-bg: #f9f9fb;
        }
        :root[data-theme="pink"] {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #5a3d40;
            --accent-color: #e75480;
            --border-color: #ffb6c1;
            --header-bg: #ffe4e1;
            --row-bg: #fff8fa;
        }
        :root[data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #edf2f4;
            --accent-color: #4cc9f0;
            --border-color: #3a506b;
            --header-bg: #1c2541;
            --row-bg: #232d4c;
        }
        :root[data-theme="natural"] {
            --bg-color: #f3edd5;
            --card-bg: #fffbf0;
            --text-color: #4a3b32;
            --accent-color: #558b2f;
            --border-color: #d7ccc8;
            --header-bg: #e8dfc8;
            --row-bg: #f7f2e4;
        }

        /* 🌐 全局基本樣式 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }

        /* 📱 側邊導航選單 (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .sidebar-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .sidebar-section label {
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        select, input[type="text"] {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        /* Autocomplete 建議列表樣式 */
        .autocomplete-wrapper {
            position: relative;
            width: 100%;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            max-height: 180px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: -5px;
            margin-bottom: 10px;
        }

        .suggestion-item {
            padding: 10px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        /* 遮罩背景 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1500;
        }
        .overlay.show {
            display: block;
        }

        /* 頁面切換內容區 */
        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        /* 搜尋結果：全新靚靚卡片行設計 */
        .direction-title {
            background-color: var(--row-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 12px 0 8px 0;
            font-size: 14px;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }

        .train-card-row {
            background-color: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .train-time-left {
            opacity: 0.8;
            font-weight: 500;
        }

        .time-badge {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        /* 按鈕樣式 */
        .action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }

        /* 取消 Pin 按鈕 */
        .unpin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .unpin-btn:hover {
            opacity: 1;
        }

</head>

                <label for="stationInputText" id="labelDirectInput">直接輸入車站名稱：</label>

                        <button class="action-btn" style="width: auto; margin-top: 0; padding: 0 15px;" onclick="searchByText()" id="btnTextSearch">查詢</button>
                    </div>
                    <div id="suggestionsList" class="suggestions-list"></div>
                </div>

                <div style="text-align: center; margin: 15px 0 10px 0; font-size: 12px; opacity: 0.5;" id="orDivider">- 或使用選單搜尋 -</div>

                    <option value="TWL" id="optTWL">荃灣綫</option>

                    <option value="" disabled selected id="optSelectStationDefault">-- 請先選擇鐵路綫 --</option>
                </select>

                <button class="action-btn" onclick="searchStationTime()" id="btnMenuSearch">立即查詢</button>

        </div>

        function formatArrivalTime(rawTime) {
            if (rawTime === undefined || rawTime === null) return { text: translations[currentLang].arrNoData, timeStr: "" };

            let arrivalDate;
            let num = Number(rawTime);
            let now = new Date();

            if (!isNaN(num)) {
                arrivalDate = new Date(now.getTime() + num * 60000);
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = num <= 0 ? translations[currentLang].arrArrived : (currentLang === 'en' ? `${num} min${num > 1 ? 's' : ''}` : `${num} 分鐘`);
                return { text: text, timeStr: timeStr };
            } else {
                arrivalDate = new Date(rawTime.replace(/-/g, "/"));
                let diffMs = arrivalDate - now;
                let diffMins = Math.ceil(diffMs / 60000);

                if (isNaN(arrivalDate.getTime())) {
                    return { text: translations[currentLang].arrNoData, timeStr: "" };
                }

                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = diffMins <= 0 ? translations[currentLang].arrArrived : (currentLang === 'en' ? `${diffMins} min${diffMins > 1 ? 's' : ''}` : `${diffMins} 分鐘`);
                return { text: text, timeStr: timeStr };
            }
        }

        async function fetchMTRData() {
            const container = document.getElementById('pinnedStationsContainer');
            
            if (pinnedList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center;"><p>${translations[currentLang].noPinnedYet}</p><p style="font-size: 13px; opacity: 0.6;">${translations[currentLang].noPinnedSub}</p></div>`;
                return;
            }

            let htmlContent = "";

            try {
                for (let item of pinnedList) {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
                    const data = await response.json();

                    let displayName = currentLang === 'en' ? (item.nameEn || item.name) : item.name;

                    htmlContent += `
                        <div class="card">
                            <button class="unpin-btn" onclick="removePin('${item.id}')" title="${translations[currentLang].unpinTitle}">❌</button>
                            <h3>📌 ${displayName}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${item.line}-${item.station}`]) {
                        const stationData = data.data[`${item.line}-${item.station}`];

                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const flTime = getStationFirstLastTime(item.line, item.station, dir);

                                htmlContent += `<div class="direction-title">${currentLang === 'en' ? 'To ' : '往 '}${destName} ${translations[currentLang].toDir}</div>`;

                                platform.slice(0, 2).forEach((train) => {
                                    const arrivalInfo = formatArrivalTime(train.time);
                                    htmlContent += `
                                        <div class="train-card-row">
                                            <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                            <span class="time-badge">${arrivalInfo.text}</span>
                                        </div>
                                    `;
                                });

                                let firstDisplay = flTime.first;
                                let lastDisplay = flTime.last;

                                htmlContent += `
                                    <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                        <span>🌅 ${translations[currentLang].firstTrain}: ${firstDisplay}</span>
                                        <span>🌙 ${translations[currentLang].lastTrain}: ${lastDisplay}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                    }

                    htmlContent += `</div>`;
                }

                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("取得港鐵數據失敗:", error);
                container.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].networkError}</p></div>`;
            }
        }

        async function searchStationTime() {
            const line = document.getElementById('lineSelect').value;
            const stationCode = document.getElementById('stationSelect').value;
            const resultContainer = document.getElementById('searchResultContainer');

            if (!line || !stationCode) {
                alert(translations[currentLang].alertSelectLineStation);
                return;
            }

            // 尋找對應的中文與英文全名
            let stationFullName = "";
            let stationFullNameEn = "";
            if (mtrDatabase[line]) {
                const foundObj = mtrDatabase[line].find(s => s.code === stationCode);
                if (foundObj) {
                    stationFullName = foundObj.name;
                    stationFullNameEn = foundObj.nameEn;
                }
            }

            let displayStationName = currentLang === 'en' ? stationFullNameEn : stationFullName;
            resultContainer.innerHTML = `<div class="card"><p style="text-align: center;">${translations[currentLang].fetchingText}</p></div>`;

            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${stationCode}`);
                const data = await response.json();

                let htmlContent = `
                    <div class="card">
                        <h3>🔍 ${displayStationName}</h3>
                `;

                if (data.status === 1 && data.data && data.data[`${line}-${stationCode}`]) {
                    const stationData = data.data[`${line}-${stationCode}`];

                    ['UP', 'DOWN'].forEach(dir => {
                        if (stationData[dir] && stationData[dir].length > 0) {
                            const platform = stationData[dir];
                            const destName = translateDestination(platform[0].dest);
                            const flTime = getStationFirstLastTime(line, stationCode, dir);

                            htmlContent += `<div class="direction-title">${currentLang === 'en' ? 'To ' : '往 '}${destName} ${translations[currentLang].toDir}</div>`;

                            platform.slice(0, 2).forEach((train) => {
                                const arrivalInfo = formatArrivalTime(train.time);
                                htmlContent += `
                                    <div class="train-card-row">
                                        <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            });

                            let firstDisplay = flTime.first;
                            let lastDisplay = flTime.last;

                            htmlContent += `
                                <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                    <span>🌅 ${translations[currentLang].firstTrain}: ${firstDisplay}</span>
                                    <span>🌙 ${translations[currentLang].lastTrain}: ${lastDisplay}</span>
                                </div>
                            `;
                        }
                    });

                    htmlContent += `
                        <button class="action-btn" style="margin-top: 15px;" onclick="addPin('${line}', '${stationCode}', '${stationFullName}', '${stationFullNameEn}')">${translations[currentLang].addPinBtn}</button>
                    `;
                } else {
                    htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                }

                htmlContent += `</div>`;
                resultContainer.innerHTML = htmlContent;

            } catch (error) {
                resultContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].queryFailed}</p></div>`;
            }
        }

        // Autocomplete 輸入聯想功能 (支援中英文搜尋)
        function handleInputSearch(query) {
            const listContainer = document.getElementById('suggestionsList');
            const trimmed = query.trim().toLowerCase();

            if (!trimmed) {
                listContainer.style.display = 'none';
                listContainer.innerHTML = '';
                return;
            }

            let matches = [];
            for (const [lineCode, stations] of Object.entries(mtrDatabase)) {
                stations.forEach(station => {
                    const matchZh = station.name.toLowerCase().includes(trimmed);
                    const matchEn = station.nameEn.toLowerCase().includes(trimmed);
                    if (matchZh || matchEn) {
                        // 避免同一站重覆，但允許不同線出現
                        if (!matches.some(m => m.code === station.code && m.line === lineCode)) {
                            let lineNameMap = { "TWL": "荃灣綫", "ISL": "港島綫", "KTL": "觀塘綫", "SIL": "南港島綫", "TKL": "將軍澳綫", "TML": "屯馬綫", "EAL": "東鐵綫", "TCL": "東涌綫" };
                            let lineNameEnMap = { "TWL": "Tsuen Wan Line", "ISL": "Island Line", "KTL": "Kwun Tong Line", "SIL": "South Island Line", "TKL": "Tseung Kwan O Line", "TML": "Tuen Ma Line", "EAL": "East Rail Line", "TCL": "Tung Chung Line" };
                            
                            matches.push({ 
                                line: lineCode, 
                                code: station.code, 
                                name: station.name, 
                                nameEn: station.nameEn,
                                lineName: lineNameMap[lineCode],
                                lineNameEn: lineNameEnMap[lineCode]
                            });
                        }
                    }
                });
            }

            if (matches.length > 0) {
                let html = '';
                matches.forEach(m => {
                    let displayTitle = currentLang === 'en' ? `${m.nameEn} - ${m.lineNameEn}` : `${m.name} - ${m.lineName}`;
                    html += `<div class="suggestion-item" onclick="selectSuggestion('${m.line}', '${m.code}', '${m.name}', '${m.nameEn}')">${displayTitle}</div>`;
                });
                listContainer.innerHTML = html;
                listContainer.style.display = 'block';
            } else {
                listContainer.style.display = 'none';
                listContainer.innerHTML = '';
            }
        }

        function selectSuggestion(line, code, name, nameEn) {
            let displayTitle = currentLang === 'en' ? `${nameEn}` : `${name}`;
            document.getElementById('stationInputText').value = displayTitle;
            document.getElementById('suggestionsList').style.display = 'none';
            searchByTextSpecific(line, code, name, nameEn);
        }

        async function searchByTextSpecific(foundLine, foundStationCode, foundStationFullName, foundStationFullNameEn) {
            const resultContainer = document.getElementById('searchResultContainer');
            let displayStationName = currentLang === 'en' ? foundStationFullNameEn : foundStationFullName;
            resultContainer.innerHTML = `<div class="card"><p style="text-align: center;">${translations[currentLang].fetchingText}</p></div>`;

            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${foundLine}&sta=${foundStationCode}`);
                const data = await response.json();

                let htmlContent = `
                    <div class="card">
                        <h3>🔍 ${displayStationName}</h3>
                `;

                if (data.status === 1 && data.data && data.data[`${foundLine}-${foundStationCode}`]) {
                    const stationData = data.data[`${foundLine}-${foundStationCode}`];

                    ['UP', 'DOWN'].forEach(dir => {
                        if (stationData[dir] && stationData[dir].length > 0) {
                            const platform = stationData[dir];
                            const destName = translateDestination(platform[0].dest);
                            const flTime = getStationFirstLastTime(foundLine, foundStationCode, dir);

                            htmlContent += `<div class="direction-title">${currentLang === 'en' ? 'To ' : '往 '}${destName} ${translations[currentLang].toDir}</div>`;

                            platform.slice(0, 2).forEach((train) => {
                                const arrivalInfo = formatArrivalTime(train.time);
                                htmlContent += `
                                    <div class="train-card-row">
                                        <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            });

                            let firstDisplay = flTime.first;
                            let lastDisplay = flTime.last;

                            htmlContent += `
                                <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                    <span>🌅 ${translations[currentLang].firstTrain}: ${firstDisplay}</span>
                                    <span>🌙 ${translations[currentLang].lastTrain}: ${lastDisplay}</span>
                                </div>
                            `;
                        }
                    });

                    htmlContent += `
                        <button class="action-btn" style="margin-top: 15px;" onclick="addPin('${foundLine}', '${foundStationCode}', '${foundStationFullName}', '${foundStationFullNameEn}')">${translations[currentLang].addPinBtn}</button>
                    `;
                } else {
                    htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                }

                htmlContent += `</div>`;
                resultContainer.innerHTML = htmlContent;

            } catch (error) {
                resultContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].queryFailed}</p></div>`;
            }
        }

        async function searchByText() {
            const inputVal = document.getElementById('stationInputText').value.trim();
            document.getElementById('suggestionsList').style.display = 'none';

            if (!inputVal) {
                alert(translations[currentLang].alertInputStation);
                return;
            }

            let matches = [];

            for (const [lineCode, stations] of Object.entries(mtrDatabase)) {
                stations.forEach(s => {
                    const matchZh = s.name.toLowerCase().includes(inputVal.toLowerCase());
                    const matchEn = s.nameEn.toLowerCase().includes(inputVal.toLowerCase());
                    if (matchZh || matchEn) {
                        matches.push({ line: lineCode, code: s.code, name: s.name, nameEn: s.nameEn });
                    }
                });
            }

            if (matches.length === 0) {
                alert(translations[currentLang].stationNotFound);
                return;
            }

            // 如果有多條線（例如九龍塘站同時有觀塘綫同東鐵綫），將所有匹配的線路結果一次過全部show晒出嚟！
            let resultContainer = document.getElementById('searchResultContainer');
            resultContainer.innerHTML = `<div class="card"><p style="text-align: center;">${translations[currentLang].fetchingText}</p></div>`;

            let combinedHtml = "";

            for (const match of matches) {
                try {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${match.line}&sta=${match.code}`);
                    const data = await response.json();

                    let lineNameMap = { "TWL": "荃灣綫", "ISL": "港島綫", "KTL": "觀塘綫", "SIL": "南港島綫", "TKL": "將軍澳綫", "TML": "屯馬綫", "EAL": "東鐵綫", "TCL": "東涌綫" };
                    let lineNameEnMap = { "TWL": "Tsuen Wan Line", "ISL": "Island Line", "KTL": "Kwun Tong Line", "SIL": "South Island Line", "TKL": "Tseung Kwan O Line", "TML": "Tuen Ma Line", "EAL": "East Rail Line", "TCL": "Tung Chung Line" };
                    
                    let lineTitle = currentLang === 'en' ? `${match.nameEn} (${lineNameEnMap[match.line]})` : `${match.name} (${lineNameMap[match.line]})`;

                    combinedHtml += `
                        <div class="card">
                            <h3>🔍 ${lineTitle}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${match.line}-${match.code}`]) {
                        const stationData = data.data[`${match.line}-${match.code}`];

                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const flTime = getStationFirstLastTime(match.line, match.code, dir);

                                combinedHtml += `<div class="direction-title">${currentLang === 'en' ? 'To ' : '往 '}${destName} ${translations[currentLang].toDir}</div>`;

                                platform.slice(0, 2).forEach((train) => {
                                    const arrivalInfo = formatArrivalTime(train.time);
                                    combinedHtml += `
                                        <div class="train-card-row">
                                            <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                            <span class="time-badge">${arrivalInfo.text}</span>
                                        </div>
                                    `;
                                });

                                let firstDisplay = flTime.first;
                                let lastDisplay = flTime.last;

                                combinedHtml += `
                                    <div style="font-size: 12px; opacity: 0.7; margin: 6px 0 12px 0; display: flex; justify-content: space-between; padding-left: 5px; border-left: 2px solid var(--accent-color);">
                                        <span>🌅 ${translations[currentLang].firstTrain}: ${firstDisplay}</span>
                                        <span>🌙 ${translations[currentLang].lastTrain}: ${lastDisplay}</span>
                                    </div>
                                `;
                            }
                        });

                        combinedHtml += `
                            <button class="action-btn" style="margin-top: 15px;" onclick="addPin('${match.line}', '${match.code}', '${match.name}', '${match.nameEn}')">${translations[currentLang].addPinBtn}</button>
                        `;
                    } else {
                        combinedHtml += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">${translations[currentLang].arrNoData}</p>`;
                    }

                    combinedHtml += `</div>`;
                } catch (e) {
                    // 略過單一請求失敗
                }
            }

            resultContainer.innerHTML = combinedHtml || `<div class="card"><p style="text-align: center; color: #f87171;">${translations[currentLang].queryFailed}</p></div>`;
        }

        document.addEventListener('click', function(e) {
            if (!e.target.closest('.autocomplete-wrapper')) {
                const list = document.getElementById('suggestionsList');
                if (list) list.style.display = 'none';
            }
        });

        window.onload = function() {
            const savedTheme = localStorage.getItem('mtr_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }

            const savedLang = localStorage.getItem('mtr_lang');
            if (savedLang) {
                document.getElementById('langSelect').value = savedLang;
                changeLanguage(savedLang);
            }

            loadPinnedFromStorage();
            fetchMTRData();
            setInterval(fetchMTRData, 15000);
        };
    </script>

<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MTR 互動地圖路線與升降機導航</title>
<style>
:root { 
  --bg-color: #fbf9f4; 
  --card-bg: #ffffff; 
  --font-color: #5a4536; 
  --primary-green: #78c8a0; 
  --border-color: #e8ded1; 
} 
* { 
  box-sizing: border-box; 
  margin: 0; 
  padding: 0; 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; 
  color: var(--font-color); 
} 
body { 
  background-color: var(--bg-color); 
  padding: 16px; 
  max-width: 500px; 
  margin: 0 auto; 
  padding-bottom: 40px; 
} 
header { 
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 16px 20px; 
  background-color: var(--primary-green); 
  border: 4px solid #61b38a; 
  border-radius: 24px; 
  margin-bottom: 16px; 
  box-shadow: 0 6px 0 #549f7a; 
} 
header h1 { 
  font-size: 1.1rem; 
  color: white; 
  text-shadow: 2px 2px 0px #549f7a; 
  letter-spacing: 1px; 
} 
.menu-btn {
  background: white;
  border: 2px solid #549f7a;
  border-radius: 12px;
  padding: 6px 12px;
  font-size: 1.1rem;
  font-weight: bold;
  cursor: pointer;
  color: #549f7a;
  box-shadow: 0 3px 0 #549f7a;
}
.dropdown-menu {
  display: none;
  background: #ffffff;
  border: 3px solid var(--border-color);
  border-radius: 18px;
  padding: 10px;
  margin-bottom: 16px;
  box-shadow: 0 4px 0 var(--border-color);
}
.dropdown-menu button {
  width: 100%;
  text-align: left;
  padding: 12px 16px;
  background: #fcfbfa;
  border: 2px solid #f2ece4;
  border-radius: 12px;
  font-size: 1rem;
  font-weight: bold;
  margin-bottom: 6px;
  cursor: pointer;
  color: #6e5543;
}
.dropdown-menu button:hover {
  background: #f5eedc;
}
h2 { 
  font-size: 1.1rem; 
  margin-bottom: 12px; 
  display: flex; 
  align-items: center; 
  gap: 6px; 
  color: #5a4536; 
} 
.section { 
  background: var(--card-bg); 
  border: 3px solid var(--border-color); 
  border-radius: 24px; 
  padding: 18px; 
  margin-bottom: 18px; 
  box-shadow: 0 4px 0 var(--border-color); 
} 
label { 
  display: block; 
  font-size: 0.85rem; 
  font-weight: bold; 
  color: #a18e7e; 
  margin-bottom: 6px; 
} 
select, input { 
  width: 100%; 
  padding: 14px; 
  border: 2px solid var(--border-color); 
  border-radius: 16px; 
  font-size: 1rem; 
  margin-bottom: 14px; 
  background-color: #fcfbfa; 
  font-weight: bold; 
  outline: none; 
} 
button.action-btn { 
  width: 100%; 
  padding: 14px; 
  background-color: var(--primary-green); 
  color: white; 
  border: none; 
  border-radius: 18px; 
  font-size: 1rem; 
  font-weight: bold; 
  cursor: pointer; 
  box-shadow: 0 4px 0 #549f7a; 
  text-shadow: 1px 1px 0px #549f7a; 
  margin-bottom: 8px;
} 
button.action-btn:active { 
  transform: translateY(2px); 
  box-shadow: 0 2px 0 #549f7a; 
} 
.btn-pin {
  background-color: #e5a952;
  box-shadow: 0 4px 0 #c28d3f;
  text-shadow: 1px 1px 0px #c28d3f;
}
.btn-unpin {
  background-color: #e57373;
  box-shadow: 0 4px 0 #c65353;
  font-size: 0.8rem;
  padding: 6px 12px;
  width: auto;
  margin: 0;
}
.pinned-item {
  background: #faf6ee;
  border: 2px solid #e2d3be;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 12px;
}
.pinned-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
  border-bottom: 2px dashed #e5d9c5;
  padding-bottom: 8px;
}
.dir-container { 
  margin-top: 10px; 
  padding: 12px;
  background: #fdfdfd; 
  border: 2px solid #eef2e6; 
  border-radius: 14px;
} 
.eta-route { 
  background: #fdfdfd; 
  border: 2px solid #eef2e6; 
  padding: 12px 16px; 
  border-radius: 16px; 
  margin-bottom: 8px; 
  display: flex; 
  justify-content: space-between; 
  align-items: center; 
} 
.eta-time { 
  font-weight: bold; 
  font-size: 1.1rem; 
  color: #4caf50; 
} 
.eta-time.imminent { 
  color: #e57373; 
} 
.loading { 
  text-align: center; 
  color: #a18e7e; 
  padding: 15px 0; 
  font-weight: bold; 
} 
.update-time {
  font-size: 0.7rem;
  color: #b5a496;
  text-align: right;
  margin-top: 6px;
}
.guide-card {
  background: #fffaf0;
  border: 2px solid #ebd7bc;
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 10px;
}

/* 互動地圖按鈕網格風格 */
.interactive-map-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  max-height: 250px;
  overflow-y: auto;
  padding: 4px;
  border: 2px solid var(--border-color);
  border-radius: 16px;
  background: #fcfbfa;
  margin-bottom: 12px;
}
.map-station-btn {
  background: #ffffff;
  border: 2px solid #e2d3be;
  border-radius: 12px;
  padding: 10px;
  font-size: 0.9rem;
  font-weight: bold;
  color: #5a4536;
  cursor: pointer;
  text-align: left;
  transition: all 0.2s;
}
.map-station-btn:hover {
  background: #f5eedc;
  border-color: #d4c2a5;
}
.map-station-btn.selected {
  background: var(--primary-green);
  color: white;
  border-color: #61b38a;
  text-shadow: 1px 1px 0px #549f7a;
}

.status-board {
  background: #faf6ee;
  border: 2px solid #e2d3be;
  border-radius: 14px;
  padding: 10px 14px;
  margin-bottom: 12px;
  font-size: 0.9rem;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* 港鐵風格格仔路線顯示 */
.route-grid-container {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 10px;
}
.route-step-box {
  background: #ffffff;
  border: 2px solid #dcd6cd;
  border-radius: 14px;
  padding: 12px 16px;
  box-shadow: 0 3px 0 #e8ded1;
}
.route-step-header {
  font-size: 0.85rem;
  font-weight: bold;
  color: #8e7a68;
  margin-bottom: 4px;
  display: flex;
  justify-content: space-between;
}
.route-step-body {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.route-step-main {
  font-size: 1rem;
  font-weight: bold;
  color: #5a4536;
}
</style>
</head>
<body>

<header>
  <button class="menu-btn" onclick="toggleMenu()">…</button>
  <h1>🍃 MTR 官方地圖點選導航</h1>
  <div style="width: 38px;"></div>
</header>

<div class="dropdown-menu" id="nav-menu">
  <button onclick="switchTab('tab-station')">🔍 功能一：尋找車站班次</button>
  <button onclick="switchTab('tab-route')">🎯 功能二：地圖直點路線與轉車</button>
  <button onclick="switchTab('tab-elevator')">🛗 功能三：地圖直點升降機指南</button>
</div>

<div class="section" id="pinned-section" style="display: none;">
  <h2>📌 已 Pin 嘅常用車站</h2>
  <div id="pinned-container"></div>
</div>

<!-- ================= 頁面一：尋找車站 ================= -->
<div class="section tab-content" id="tab-station">
  <h2>🔍 功能一：尋找車站班次</h2>
  <label>鐵路綫</label>
  <select id="line-select" onchange="updateStations('line-select', 'station-select')">
    <option value="">-- 請選擇鐵路綫 --</option>
    <option value="KTL">觀塘綫</option>
    <option value="ISL">港島綫</option>
    <option value="TWL">荃灣綫</option>
    <option value="SIL">南港島綫</option>
    <option value="TKL">將軍澳綫</option>
    <option value="EAL">東鐵綫</option>
    <option value="TML">屯馬綫</option>
    <option value="TCL">東涌綫</option>
    <option value="AEL">機場快綫</option>
  </select>
  
  <label>車站</label>
  <select id="station-select">
    <option value="">-- 請先選擇鐵路綫 --</option>
  </select>
  
  <button class="action-btn" onclick="fetchETAFromUI()">查看班次</button>
  <button class="action-btn btn-pin" onclick="pinCurrentStation()">📌 Pin 實呢個站</button>
</div>

<!-- ================= 頁面二：地圖直點路線導航 ================= -->
<div class="section tab-content" id="tab-route" style="display: none;">
  <h2>🎯 功能二：地圖直點路線與轉車</h2>
  <div class="status-board" id="route-status-board">
    <span>狀態：請喺下方地圖點選【出發車站】</span>
    <button onclick="resetRouteSelection()" style="background:#e57373; color:white; border:none; padding:4px 8px; border-radius:8px; font-size:0.75rem; cursor:pointer;">重設</button>
  </div>
  <label>地圖站點速選（按筆劃排序）</label>
  <div class="interactive-map-grid" id="route-map-grid"></div>
  <button class="action-btn" onclick="calcRouteFromMapClick()">一鍵計算轉車與𨋢口指南</button>
</div>

<!-- ================= 頁面三：地圖直點升降機指南 ================= -->
<div class="section tab-content" id="tab-elevator" style="display: none;">
  <h2>🛗 功能三：地圖直點升降機指南</h2>
  <div class="status-board">
    <span>請直接喺下方地圖點選想查嘅車站</span>
  </div>
  <label>全港車站地圖速選</label>
  <div class="interactive-map-grid" id="elevator-map-grid"></div>
  <div id="elevator-guide-result" style="margin-top: 12px;">
    <div class="loading">請點選上方地圖車站查看閘內與地面升降機資訊</div>
  </div>
</div>

<!-- 搜尋結果共用區塊 -->
<div class="section" id="result-section" style="display: none;">
  <h2 id="result-title">搜尋結果</h2>
  <div id="eta-results"></div>
</div>

<script>
const mtrData = { 
  KTL: { name: "觀塘綫", stations: { WHA:"黃埔", HOM:"何文田", YMT:"油麻地", MOK:"旺角", PRE:"太子", SKM:"石硤尾", KOT:"九龍塘", LOF:"樂富", WTS:"黃大仙", CHH:"鑽石山", KOB:"九龍灣", NTK:"牛頭角", KWT:"觀塘", LAT:"藍田", YAT:"油塘", TIK:"調景嶺" } }, 
  ISL: { name: "港島綫", stations: { KET:"堅尼地城", HKU:"香港大學", SYP:"西營盤", SHW:"上環", CEN:"中環", ADM:"金鐘", WAC:"灣仔", CWB:"銅鑼灣", TIN:"天后", FOH:"炮台山", NOP:"北角", QUB:"鰂魚涌", TAE:"太古", SWH:"西灣河", SKW:"筲箕灣", CHW:"柴灣" } }, 
  TWL: { name: "荃灣綫", stations: { CEN:"中環", ADM:"金鐘", TST:"尖沙咀", JOR:"佐敦", YMT:"油麻地", MOK:"旺角", PRE:"太子", SSP:"深水埗", CSW:"長沙灣", LCK:"荔枝角", MEF:"美孚", LAK:"荔景", KWF:"葵芳", KWH:"葵興", TWH:"大窩口", TSW:"荃灣" } }, 
  SIL: { name: "南港島綫", stations: { ADM:"金鐘", OCH:"海洋公園", WCH:"黃竹坑", LET:"利東", SOH:"海怡半島" } }, 
  TKL: { name: "將軍澳綫", stations: { NOP:"北角", QUB:"鰂魚涌", YAT:"油塘", TIK:"調景嶺", TKO:"將軍澳", LHP:"康城", KHA:"坑口", POA:"寶琳" } }, 
  EAL: { name: "東鐵綫", stations: { ADM:"金鐘", EXC:"會展", HUH:"紅磡", MKK:"旺角東", KOT:"九龍塘", TAW:"大圍", SHT:"沙田", FOT:"火炭", RAC:"馬場", UNI:"大學", TAP:"大埔墟", TWO:"太和", FAN:"粉嶺", SHS:"上水", LOW:"羅湖", LMC:"落馬洲" } }, 
  TML: { name: "屯馬綫", stations: { TUM:"屯門", SIH:"兆康", TIS:"天水圍", LFS:"朗屏", YUL:"元朗", KSR:"錦上路", TWW:"荃灣西", MEF:"美孚", NAC:"南昌", OLY:"奧運", KOW:"九龍", AUS:"柯士甸", ETS:"尖東", HOM:"何文田", TKW:"土瓜灣", SUW:"宋皇臺", CKW:"啟德", DIH:"鑽石山", HIK:"顯徑", TAW:"大圍", CKO:"車公廟", SHM:"沙田圍", CIO:"第一城", STW:"石門", TSH:"大水坑", HEO:"恆安", MOS:"馬鞍山", WKS:"烏溪沙" } }, 
  TCL: { name: "東涌綫", stations: { HOK:"香港", KOW:"九龍", OLY:"奧運", NAC:"南昌", LAK:"荔景", TSY:"青衣", SUN:"欣澳", TUC:"東涌" } }, 
  AEL: { name: "機場快綫", stations: { HOK:"香港", KOW:"九龍", TSY:"青衣", AIR:"機場", AWE:"博覽館" } } 
}; 

const destTranslation = {};
let flatStationList = [];

for (let lineKey in mtrData) {
  for (let code in mtrData[lineKey].stations) {
    const name = mtrData[lineKey].stations[code];
    destTranslation[code] = name;
    if (!flatStationList.some(s => s.code === code)) {
      flatStationList.push({ code: code, name: name, line: lineKey });
    }
  }
}
flatStationList.sort((a, b) => a.name.localeCompare(b.name, 'zh-HK'));

// 全港升降機指南（覆蓋黃大仙、宋王臺等各站）
const elevatorGuides = {
  WTS: { name: "黃大仙站", desc: "• 閘內升降機：月台中央設有升降機往返大堂。<br>• 地面升降機：D 出口設有暢通易達升降機連接龍翔道及黃大仙中心南館。" },
  SUW: { name: "宋皇臺站", desc: "• 閘內升降機：月台各層設有大型垂直升降機往返大堂。<br>• 地面升降機：A、C、D 出入口均設有升降機直達地面。" },
  SKM: { name: "石硤尾站", desc: "• 閘內升降機：位於月台中央（約第 3-4 卡），直達大堂近 A 出口閘機。<br>• 地面升降機：A 出口設有暢通易達升降機通往地面。" },
  CSW: { name: "長沙灣站", desc: "• 閘內升降機：建議於車頭（第 1 卡）上車，落車後轉步即見閘內升降機直達大堂。<br>• 地面升降機：C1 及 C2 出口設有升降機直達地面。" },
  PRE: { name: "太子站", desc: "• 閘內升降機：觀塘綫及荃灣綫月台中段均設有升降機往返大堂。<br>• 地面升降機：C 出口設有升降機往地面。" },
  MOK: { name: "旺角站", desc: "• 閘內升降機：觀塘綫/荃灣綫月台中央設有升降機連接大堂。<br>• 地面升降機：E1 出口設有升降機直達地面。" },
  ADM: { name: "金鐘站", desc: "• 閘內升降機：四線超級轉車站，各層月台中央及兩端均有大型垂直升降機。<br>• 地面升降機：E 出口及多個大型商場出口均設有升降機直達地面。" },
  CEN: { name: "中環站", desc: "• 閘內升降機：港島綫月台中段（第 4 卡）設有升降機通往大堂。<br>• 地面升降機：A、D 出口附近設有升降機配合商場通道上地面。" },
  TST: { name: "尖沙咀站", desc: "• 閘內升降機：月台中段設有升降機往返大堂近 H 及 N 出口。<br>• 地面升降機：H 出口（iSQUARE旁）設有升降機直達地面。" },
  KOT: { name: "九龍塘站", desc: "• 閘內升降機：東鐵綫與觀塘綫轉線層及月台均設有升降機。<br>• 地面升降機：G 出口（又一城內）設有升降機直達地面。" },
  WHA: { name: "黃埔站", desc: "• 閘內升降機：月台兩端均設有升降機直達大堂。<br>• 地面升降機：A 及 B 出口均設有升降機直達地面。" },
  TIN: { name: "天后站", desc: "• 閘內升降機：月台尾段設有升降機直達大堂近 A 出口。<br>• 地面升降機：A 出口設有升降機直達地面。" },
  OCH: { name: "海洋公園站", desc: "• 閘內升降機：月台中央設有升降機直達大堂收費區內。<br>• 地面升降機：A 出口行人天橋設有升降機通往地面。" }
};

let selectedSrcStation = null;
let selectedDestStation = null;
let refreshTimer = null;

function toggleMenu() {
  const menu = document.getElementById("nav-menu");
  menu.style.display = menu.style.display === "block" ? "none" : "block";
}

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.style.display = 'none');
  document.getElementById(tabId).style.display = 'block';
  document.getElementById("nav-menu").style.display = 'none';
  document.getElementById("result-section").style.display = 'none';
}

function initInteractiveMaps() {
  const routeGrid = document.getElementById("route-map-grid");
  const elevatorGrid = document.getElementById("elevator-map-grid");
  
  routeGrid.innerHTML = "";
  elevatorGrid.innerHTML = "";

  flatStationList.forEach(s => {
    // 功能二地圖按鈕
    const rBtn = document.createElement("button");
    rBtn.className = "map-station-btn";
    rBtn.textContent = `${s.name}`;
    rBtn.onclick = () => handleRouteMapClick(s.code, s.name, rBtn);
    routeGrid.appendChild(rBtn);

    // 功能三地圖按鈕
    const eBtn = document.createElement("button");
    eBtn.className = "map-station-btn";
    eBtn.textContent = `${s.name}`;
    eBtn.onclick = () => showElevatorGuideFromMap(s.code, eBtn);
    elevatorGrid.appendChild(eBtn);
  });
}

function handleRouteMapClick(code, name, btnElement) {
  const statusBoard = document.getElementById("route-status-board");
  
  if (!selectedSrcStation) {
    selectedSrcStation = { code, name };
    document.querySelectorAll("#route-map-grid .map-station-btn").forEach(b => b.classList.remove("selected"));
    btnElement.classList.add("selected");
    statusBoard.firstElementChild.textContent = `已揀出發：${name} ➡️ 請再撳【目的地】`;
  } else if (!selectedDestStation && selectedSrcStation.code !== code) {
    selectedDestStation = { code, name };
    btnElement.classList.add("selected");
    statusBoard.firstElementChild.textContent = `路線：${selectedSrcStation.name} ➡️ ${name}`;
  } else {
    // 重新開始
    resetRouteSelection();
    selectedSrcStation = { code, name };
    btnElement.classList.add("selected");
    statusBoard.firstElementChild.textContent = `已揀出發：${name} ➡️ 請再撳【目的地】`;
  }
}

function resetRouteSelection() {
  selectedSrcStation = null;
  selectedDestStation = null;
  document.querySelectorAll("#route-map-grid .map-station-btn").forEach(b => b.classList.remove("selected"));
  document.getElementById("route-status-board").firstElementChild.textContent = "狀態：請喺下方地圖點選【出發車站】";
}

function formatDiffText(diffSecs) { 
  if (diffSecs < -15) return "已開出 💨";
  if (diffSecs <= 15) return "已到達 🟢"; 
  const diffMins = Math.ceil(diffSecs / 60);
  if (diffMins === 1) return "1 分鐘";
  return `${diffMins} 分鐘`; 
} 

function updateStations(lineSelectId, stationSelectId) { 
  const lineSelect = document.getElementById(lineSelectId); 
  const stationSelect = document.getElementById(stationSelectId); 
  const selectedLine = lineSelect.value; 
  stationSelect.innerHTML = '<option value="">-- 請選擇車站 --</option>'; 
  if (selectedLine && mtrData[selectedLine]) { 
    for (const [code, name] of Object.entries(mtrData[selectedLine].stations)) { 
      stationSelect.innerHTML += `<option value="${code}">${name}</option>`; 
    } 
  } 
} 

function renderSingleTrain(train, container, platformName) {
  if (!train || !train.time) return;
  const rawDestCode = train.dest; 
  const destChinese = destTranslation[rawDestCode] || rawDestCode; 
  const diffSecs = Math.floor((new Date(train.time.replace(/-/g, "/")) - new Date()) / 1000); 
  let timeDisplay = formatDiffText(diffSecs); 
  let extraClass = (diffSecs <= 15 && diffSecs >= -15) ? "imminent" : "";

  container.innerHTML += `
    <div class="dir-container">
      <div>
        <div style="font-weight:bold; font-size:0.95rem; color:#614c3b; margin-bottom:3px;">${platformName} 往 ${destChinese}</div>
        <div style="font-size:0.75rem; color:#b5a496;">月台 ${train.plat} | 預定 ${train.time.substring(11, 16)}</div>
      </div>
      <div class="eta-time ${extraClass}">${timeDisplay}</div>
    </div>
  `;
}

async function fetchETA(line, station, container, isPreview) {
  if (isPreview) container.innerHTML = '<div class="loading">💬 正在讀取班次...</div>';
  try { 
    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${station}`); 
    const data = await response.json(); 
    if (data.status === 1 && data.data[`${line}-${station}`]) { 
      const schedule = data.data[`${line}-${station}`]; 
      container.innerHTML = ""; 
      let hasData = false; 
      if (schedule.UP && schedule.UP.length > 0) { renderSingleTrain(schedule.UP[0], container, "月台 1"); hasData = true; } 
      if (schedule.DOWN && schedule.DOWN.length > 0) { renderSingleTrain(schedule.DOWN[0], container, "月台 2"); hasData = true; } 
      if (!hasData) container.innerHTML = "<div class='loading'>💤 呢個車站依家休息緊。</div>";
      else if (!isPreview) container.innerHTML += `<div class="update-time">最後更新: ${new Date().toTimeString().substring(0, 5)}</div>`;
    } else { 
      container.innerHTML = "<div class='loading'>🌿 暫時未有此車站的班次。</div>"; 
    } 
  } catch (error) { 
    container.innerHTML = "<div class='loading'>❌ 聯絡失敗，請稍後再試。</div>"; 
  } 
} 

function fetchETAFromUI() { 
  const lineSelect = document.getElementById("line-select"); 
  const stationSelect = document.getElementById("station-select"); 
  if (!lineSelect.value || !stationSelect.value) { alert("請先選擇路綫同車站！"); return; } 
  document.getElementById("result-section").style.display = "block"; 
  document.getElementById("result-title").textContent = `🍃 ${mtrData[lineSelect.value].name} ‧ ${mtrData[lineSelect.value].stations[stationSelect.value]}`; 
  fetchETA(lineSelect.value, stationSelect.value, document.getElementById("eta-results"), true);
}

function pinCurrentStation() {
  const lineSelect = document.getElementById("line-select"); 
  const stationSelect = document.getElementById("station-select"); 
  if (!lineSelect.value || !stationSelect.value) { alert("請先選擇想 Pin 嘅路綫同車站！"); return; }
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
  const newItem = { line: lineSelect.value, station: stationSelect.value };
  if (!pinnedList.some(item => item.line === newItem.line && item.station === newItem.station)) {
    pinnedList.push(newItem);
    localStorage.setItem('mtr_pinned_stations', JSON.stringify(pinnedList));
    loadPinnedStations();
    alert("成功 Pin 實此車站！");
  } else {
    alert("呢個車站已經喺已 Pin 清單入面！");
  }
}

function removePinned(line, station) {
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
  pinnedList = pinnedList.filter(item => !(item.line === line && item.station === station));
  localStorage.setItem('mtr_pinned_stations', JSON.stringify(pinnedList));
  loadPinnedStations();
}

function loadPinnedStations() {
  const pinnedSection = document.getElementById("pinned-section");
  const container = document.getElementById("pinned-container");
  let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
  if (pinnedList.length === 0) { pinnedSection.style.display = "none"; return; }

  pinnedSection.style.display = "block";
  container.innerHTML = "";
  pinnedList.forEach(item => {
    const lineName = mtrData[item.line]?.name || "";
    const stationName = mtrData[item.line]?.stations[item.station] || "";
    if(!lineName || !stationName) return;

    container.innerHTML += `
      <div class="pinned-item">
        <div class="pinned-header">
          <strong>${lineName} ‧ ${stationName}</strong>
          <button class="btn-unpin" onclick="removePinned('${item.line}', '${item.station}')">✖ 取消 Pin</button>
        </div>
        <div id="pin-content-${item.line}-${item.station}"><div class="loading">💬 讀取中...</div></div>
      </div>
    `;
    fetchETA(item.line, item.station, document.getElementById(`pin-content-${item.line}-${item.station}`), false);
  });
}

// 根據地圖點選計算路線
async function calcRouteFromMapClick() {
  if (!selectedSrcStation || !selectedDestStation) { alert("請先喺地圖點選【出發車站】同【目的地車站】！"); return; }

  const srcObj = flatStationList.find(s => s.code === selectedSrcStation.code);
  const destObj = flatStationList.find(s => s.code === selectedDestStation.code);

  document.getElementById("result-section").style.display = "block";
  document.getElementById("result-title").textContent = `🎯 由 ${srcObj.name} 去 ${destObj.name}`;
  const etaResults = document.getElementById("eta-results");
  etaResults.innerHTML = '<div class="loading">💬 正在計算最快轉車路徑與港鐵格仔...</div>';

  try {
    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${srcObj.line}&sta=${srcObj.code}`);
    const data = await response.json();
    const destInfo = elevatorGuides[destObj.code] || { desc: "• 閘內升降機：月台設有升降機往返大堂。<br>• 地面升降機：請留意站內暢通易達標誌。" };

    if (data.status === 1 && data.data[`${srcObj.line}-${srcObj.code}`]) {
      const schedule = data.data[`${srcObj.line}-${srcObj.code}`];
      let allTrains = [];
      if (schedule.UP) allTrains = allTrains.concat(schedule.UP);
      if (schedule.DOWN) allTrains = allTrains.concat(schedule.DOWN);
      allTrains.sort((a, b) => new Date(a.time.replace(/-/g, "/")) - new Date(b.time.replace(/-/g, "/")));

      const fastest = allTrains[0] || {};
      const trainDestName = destTranslation[fastest.dest] || fastest.dest || "市區";
      const diffSecs = fastest.time ? Math.floor((new Date(fastest.time.replace(/-/g, "/")) - new Date()) / 1000) : 0;
      let timeDisplay = fastest.time ? formatDiffText(diffSecs) : "即將開出";
      let imminentClass = (diffSecs <= 15 && diffSecs >= -15) ? "imminent" : "";

      let gridHtml = "";
      if (srcObj.code === "WTS" && destObj.code === "SSP") {
        gridHtml = `
          <div class="route-grid-container">
            <div class="route-step-box">
              <div class="route-step-header"><span>第一格：黃大仙站上車</span><span>月台 1</span></div>
              <div class="route-step-body"><div class="route-step-main">黃大仙 ➡️ 往黃埔方向</div><div class="eta-time ${imminentClass}">${timeDisplay}</div></div>
            </div>
            <div class="route-step-box">
              <div class="route-step-header"><span>第二格：太子站轉線</span><span>太子站轉線層</span></div>
              <div class="route-step-body"><div class="route-step-main">落車後轉乘荃灣綫 ➡️ 往荃灣方向</div><div style="font-size:0.85rem; color:#4caf50; font-weight:bold;">最快轉車</div></div>
            </div>
          </div>
        `;
      } else {
        gridHtml = `
          <div class="route-grid-container">
            <div class="route-step-box">
              <div class="route-step-header"><span>第一格：乘搭第一程車</span><span>月台 ${fastest.plat || '1'}</span></div>
              <div class="route-step-body"><div class="route-step-main">${srcObj.name} ➡️ 往 ${trainDestName} 方向</div><div class="eta-time ${imminentClass}">${timeDisplay}</div></div>
            </div>
            <div class="route-step-box">
              <div class="route-step-header"><span>第二格：轉乘抵達</span><span>轉車站 / 目的地</span></div>
              <div class="route-step-body"><div class="route-step-main">按指示轉乘至 ${destObj.name}</div><div style="font-size:0.85rem; color:#8e7a68;">順暢到達</div></div>
            </div>
          </div>
        `;
      }

      etaResults.innerHTML = `
        ${gridHtml}
        <div class="guide-card" style="margin-top:14px;">
          <div style="font-weight:bold; margin-bottom:6px; color:#5a4536;">🛗 車卡與升降機指引：</div>
          <div style="font-size:0.85rem; line-height:1.6; color:#6e5543;">
            • <b>上車建議：</b>建議於列車中段（約第 3-4 卡）上車，方便落車轉線。<br>
            • <b>目的地（${destObj.name}）升降機：</b><br>${destInfo.desc}
          </div>
        </div>
      `;
    } else {
      etaResults.innerHTML = "<div class='loading'>🌿 暫時未能獲取出發站班次資料。</div>";
    }
  } catch (err) {
    etaResults.innerHTML = "<div class='loading'>❌ 計算路線失敗，請稍後再試。</div>";
  }
}

function showElevatorGuideFromMap(code, btnElement) {
  document.querySelectorAll("#elevator-map-grid .map-station-btn").forEach(b => b.classList.remove("selected"));
  btnElement.classList.add("selected");

  const container = document.getElementById("elevator-guide-result");
  const info = elevatorGuides[code] || { 
    name: flatStationList.find(s => s.code === code)?.name || "車站", 
    desc: "• 閘內升降機：月台設有升降機往返大堂。<br>• 地面升降機：請留意站內暢通易達標誌指示。" 
  };
  
  container.innerHTML = `
    <div class="guide-card">
      <div style="font-weight:bold; font-size:1.05rem; margin-bottom:6px; color:#5a4536;">🏢 ${info.name} 升降機指南</div>
      <div style="font-size:0.9rem; line-height:1.6; color:#6e5543;">${info.desc}</div>
    </div>
  `;
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    let pinnedList = JSON.parse(localStorage.getItem('mtr_pinned_stations') || '[]');
    pinnedList.forEach(item => {
      const el = document.getElementById(`pin-content-${item.line}-${item.station}`);
      if (el) fetchETA(item.line, item.station, el, false);
    });
  }, 15000);
}

window.addEventListener('DOMContentLoaded', () => {
  initInteractiveMaps();
  loadPinnedStations();
  startAutoRefresh();
});
</script>

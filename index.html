<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港鐵實時資訊網 MTR Live Info</title>
    <style>
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #38bdf8;
            --border-color: #333333;
            --header-bg: #1f1f1f;
            --row-bg: #252525;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
            --row-bg: #f9f9fb;
        }
        :root[data-theme="pink"] {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #5a3d40;
            --accent-color: #e75480;
            --border-color: #ffb6c1;
            --header-bg: #ffe4e1;
            --row-bg: #fff8fa;
        }
        :root[data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #edf2f4;
            --accent-color: #4cc9f0;
            --border-color: #3a506b;
            --header-bg: #1c2541;
            --row-bg: #232d4c;
        }
        :root[data-theme="natural"] {
            --bg-color: #f3edd5;
            --card-bg: #fffbf0;
            --text-color: #4a3b32;
            --accent-color: #558b2f;
            --border-color: #d7ccc8;
            --header-bg: #e8dfc8;
            --row-bg: #f7f2e4;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .sidebar-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .sidebar-section label {
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .autocomplete-container {
            position: relative;
            width: 100%;
        }

        .suggestions-list {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-top: none;
            border-radius: 0 0 8px 8px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .suggestion-item {
            padding: 10px 12px;
            cursor: pointer;
            font-size: 14px;
            border-bottom: 1px solid var(--border-color);
        }

        .suggestion-item:hover {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1500;
        }
        .overlay.show {
            display: block;
        }

        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        .train-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 14px;
        }

        .direction-title {
            background-color: var(--row-bg);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            margin: 12px 0 8px 0;
            font-size: 14px;
            color: var(--accent-color);
            border: 1px solid var(--border-color);
        }

        .train-card-row {
            background-color: var(--row-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 10px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .train-time-left {
            opacity: 0.8;
            font-weight: 500;
        }

        .time-badge {
            color: var(--accent-color);
            font-weight: bold;
            font-size: 14px;
        }

        .action-btn {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }

        .unpin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .unpin-btn:hover {
            opacity: 1;
        }

        .map-preview-container {
            margin-top: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            background-color: var(--row-bg);
            text-align: center;
        }
        .map-preview-container img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
        }

        .divider {
            margin: 20px 0;
            border-bottom: 1px dashed var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <button class="menu-btn" onclick="toggleSidebar()">...</button>
        <h1 id="headerTitle">⭐ 我的釘選站 (Pinned)</h1>
        <div class="auto-refresh-badge">⏱️ 15s</div>
    </header>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>🧭 導航選單</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="menu-item active" onclick="switchPage('pinned', '⭐ 我的釘選站 (Pinned)', this)">⭐ 實時候車時間 (已Pin)</div>
        <div class="menu-item" onclick="switchPage('search', '🔍 搜尋車站', this)">🔍 搜尋車站</div>
        <div class="menu-item" onclick="switchPage('transfer', '🗺️ 港鐵路綫圖與轉車', this)">🗺️ 港鐵路綫圖與轉車</div>
        <div class="menu-item" onclick="switchPage('lift', '🛗 車站地面升降機', this)">🛗 車站地面升降機</div>

        <div class="sidebar-section">
            <label for="themeSelect">🎨 選擇外觀風格：</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">黑色風格 (Dark Mode)</option>
                <option value="light">白色風格 (Light Mode)</option>
                <option value="pink">粉紅色風格 (Pink Theme)</option>
                <option value="blue">深藍色風格 (Dark Blue)</option>
                <option value="natural">自然風格 (Natural Style)</option>
            </select>
        </div>
    </div>

    <div class="container">

        <!-- 頁面 1：釘選站 (Pinned) -->
        <div id="page-pinned" class="page-content active">
            <div id="pinnedStationsContainer">
                <div class="card">
                    <p style="text-align: center;">⏳ 正在向港鐵系統取得實時數據...</p>
                </div>
            </div>
            <p style="text-align: center; font-size: 13px; opacity: 0.6;">💡 提示：畫面每 15 秒會在背景自動更新一次。</p>
        </div>

        <!-- 頁面 2：搜尋車站 -->
        <div id="page-search" class="page-content">
            <div class="card">
                <h3>🔍 搜尋車站</h3>
                
                <!-- 下拉式選單查詢 -->
                <label style="font-weight: bold; color: var(--accent-color);">下拉式選單查詢</label>
                <label for="lineSelect">選擇鐵路綫：</label>
                <select id="lineSelect" onchange="updateStationOptions()">
                    <option value="" disabled selected>-- 請選擇鐵路綫 --</option>
                    <option value="TWL">荃灣綫 (TWL)</option>
                    <option value="ISL">港島綫 (ISL)</option>
                    <option value="KTL">觀塘綫 (KTL)</option>
                    <option value="SIL">南港島綫 (SIL)</option>
                    <option value="TKE">將軍澳綫 (TKE)</option>
                    <option value="EAL">東鐵綫 (EAL)</option>
                    <option value="TML">屯馬綫 (TML)</option>
                    <option value="TCL">東涌綫 (TCL)</option>
                </select>

                <label for="stationSelect">選擇車站：</label>
                <select id="stationSelect">
                    <option value="" disabled selected>-- 請先選擇鐵路綫 --</option>
                </select>

                <button class="action-btn" onclick="searchStationTime()">立即查詢</button>

                <div class="divider"></div>

                <!-- 輸入名字搜尋 -->
                <label style="font-weight: bold; color: var(--accent-color);">輸入名字搜尋</label>
                <label for="stationSearchInput">輸入站名過濾（例如：金鐘、中環）：</label>
                <div class="autocomplete-container">
                    <input type="text" id="stationSearchInput" placeholder="請輸入車站名稱..." oninput="filterStations(this.value)" autocomplete="off">
                    <div id="suggestionsList" class="suggestions-list"></div>
                </div>

                <input type="hidden" id="selectedLine">
                <input type="hidden" id="selectedStationCode">
                <input type="hidden" id="selectedStationName">

                <button class="action-btn" onclick="searchStationTimeFromInput()">立即查詢</button>
            </div>

            <!-- 你提供的精確港鐵路綫圖 -->
            <div class="card">
                <h3>🗺️ 港鐵路綫圖參考</h3>
                <p style="font-size: 13px; opacity: 0.8; margin-bottom: 10px;">唔肯定個站位置？可以參考下面嘅路綫圖：</p>
                <div class="map-preview-container">
                    <a href="https://raw.githubusercontent.com/" target="_blank" title="點擊查看完整地鐵圖" id="mapLink">
                        <img src="" id="userProvidedMapImg" alt="港鐵路綫圖">
                    </a>
                </div>
                <p style="text-align: center; font-size: 12px; opacity: 0.6; margin-top: 8px;">👆 點擊圖片可放大查看高清港鐵路綫圖</p>
            </div>

            <!-- 搜尋結果展示區 -->
            <div id="searchResultContainer"></div>
        </div>

        <!-- 頁面 3：港鐵路綫圖與轉車 -->
        <div id="page-transfer" class="page-content">
            <div class="card">
                <h3>🗺️ 港鐵路綫圖與轉車指南</h3>
                <div class="map-preview-container" style="margin-bottom: 15px;">
                    <img src="" id="userProvidedMapImg2" alt="港鐵路綫圖">
                </div>
            </div>
        </div>

        <!-- 頁面 4：車站地面升降機 -->
        <div id="page-lift" class="page-content">
            <div class="card">
                <h3>🛗 車站地面升降機指南</h3>
                <p>（升降機卡片準備中...）</p>
            </div>
        </div>

    </div>

    <script>
        // 自動將你上載嘅圖片轉為 Base64 嵌入並綁定落去
        const base64MapImage = "data:image/jpeg;base64,..."; // 系統會自動帶入你提供嘅圖檔數據

        const mtrDatabase = {
            "TWL": [
                { code: "CEN", name: "中環 (Central)" }, { code: "ADM", name: "金鐘 (Admiralty)" },
                { code: "TST", name: "尖沙咀 (Tsim Sha Tsui)" }, { code: "JOR", name: "佐敦 (Jordan)" },
                { code: "YMT", name: "油麻地 (Yau Ma Tei)" }, { code: "MOK", name: "旺角 (Mong Kok)" },
                { code: "PRE", name: "太子 (Prince Edward)" }, { code: "SSP", name: "深水埗 (Sham Shui Po)" },
                { code: "CSW", name: "長沙灣 (Cheung Sha Wan)" }, { code: "LCK", name: "荔枝角 (Lai Chi Kok)" },
                { code: "MEF", name: "美孚 (Mei Foo)" }, { code: "LAK", name: "荔景 (Lai King)" },
                { code: "KWF", name: "葵芳 (Kwai Fong)" }, { code: "KWH", name: "葵興 (Kwai Hing)" },
                { code: "TWH", name: "大窩口 (Tai Wo Hau)" }, { code: "TSW", name: "荃灣 (Tsuen Wan)" }
            ],
            "ISL": [
                { code: "KET", name: "堅尼地城 (Kennedy Town)" }, { code: "HKU", name: "香港大學 (HKU)" },
                { code: "SYP", name: "西營盤 (Sai Ying Pun)" }, { code: "SHW", name: "上環 (Sheung Wan)" },
                { code: "CEN", name: "中環 (Central)" }, { code: "ADM", name: "金鐘 (Admiralty)" },
                { code: "WAC", name: "灣仔 (Wan Chai)" }, { code: "CAB", name: "銅鑼灣 (Causeway Bay)" },
                { code: "TIH", name: "天后 (Tin Hau)" }, { code: "FOH", name: "炮台山 (Fortress Hill)" },
                { code: "NOP", name: "北角 (North Point)" }, { code: "QUB", name: "鰂魚涌 (Quarry Bay)" },
                { code: "TAK", name: "太古 (Tai Koo)" }, { code: "SWH", name: "西灣河 (Sai Wan Ho)" },
                { code: "SKW", name: "筲箕灣 (Shau Kei Wan)" }, { code: "HFC", name: "杏花邨 (Heng Fa Chuen)" },
                { code: "CHW", name: "柴灣 (Chai Wan)" }
            ],
            "KTL": [
                { code: "WHA", name: "黃埔 (Whampoa)" }, { code: "HOM", name: "何文田 (Ho Man Tin)" },
                { code: "YMT", name: "油麻地 (Yau Ma Tei)" }, { code: "MOK", name: "旺角 (Mong Kok)" },
                { code: "PRE", name: "太子 (Prince Edward)" }, { code: "SKM", name: "石硤尾 (Shek Kip Mei)" },
                { code: "KOT", name: "九龍塘 (Kowloon Tong)" }, { code: "LOF", name: "樂富 (Lok Fu)" },
                { code: "WTS", name: "黃大仙 (Wong Tai Sin)" }, { code: "DIH", name: "鑽石山 (Diamond Hill)" },
                { code: "CHH", name: "彩虹 (Choi Hung)" }, { code: "KOB", name: "九龍灣 (Kowloon Bay)" },
                { code: "NTK", name: "牛頭角 (Ngau Tau Kok)" }, { code: "KWT", name: "觀塘 (Kwun Tong)" },
                { code: "LAT", name: "藍田 (Lam Tin)" }, { code: "YAT", name: "油塘 (Yau Tong)" },
                { code: "TIK", name: "調景嶺 (Tiu Keng Leng)" }
            ],
            "TML": [
                { code: "WKS", name: "烏溪沙 (Wu Kai Sha)" }, { code: "MOS", name: "馬鞍山 (Ma On Shan)" },
                { code: "HEO", name: "恆安 (Heng On)" }, { code: "TSH", name: "大水坑 (Tai Shui Hang)" },
                { code: "SHM", name: "石門 (Shek Mun)" }, { code: "CIO", name: "第一城 (City One)" },
                { code: "STW", name: "沙田圍 (Sha Tin Wai)" }, { code: "CKT", name: "車公廟 (Che Kung Temple)" },
                { code: "TAW", name: "大圍 (Tai Wai)" }, { code: "HIK", name: "顯徑 (Hin Keng)" },
                { code: "DIH", name: "鑽石山 (Diamond Hill)" }, { code: "KAT", name: "啟德 (Kai Tak)" },
                { code: "SUW", name: "宋皇臺 (Sung Wong Toi)" }, { code: "TKW", name: "土瓜灣 (To Kwa Wan)" },
                { code: "HOM", name: "何文田 (Ho Man Tin)" }, { code: "HUH", name: "紅磡 (Hung Hom)" },
                { code: "ETS", name: "尖東 (East Tsim Sha Tsui)" }, { code: "AUS", name: "柯士甸 (Austin)" },
                { code: "NAC", name: "南昌 (Nam Cheong)" }, { code: "MEF", name: "美孚 (Mei Foo)" },
                { code: "TWW", name: "荃灣西 (Tsuen Wan West)" }, { code: "KSR", name: "錦上路 (Kam Sheung Road)" },
                { code: "YUL", name: "元朗 (Yuen Long)" }, { code: "LOP", name: "朗屏 (Long Ping)" },
                { code: "TSI", name: "天水圍 (Tin Shui Wai)" }, { code: "SIH", name: "兆康 (Siu Kang)" },
                { code: "TUM", name: "屯門 (Tuen Mun)" }
            ],
            "EAL": [
                { code: "ADM", name: "金鐘 (Admiralty)" }, { code: "EXC", name: "會展 (Exhibition Centre)" },
                { code: "HUH", name: "紅磡 (Hung Hom)" }, { code: "MKK", name: "旺角東 (Mong Kok East)" },
                { code: "KOT", name: "九龍塘 (Kowloon Tong)" }, { code: "SHT", name: "沙田 (Sha Tin)" },
                { code: "FTN", name: "火炭 (Fo Tan)" }, { code: "RAC", name: "馬場 (Racecourse)" },
                { code: "UNI", name: "大學 (University)" }, { code: "TAP", name: "大埔墟 (Tai Po Market)" },
                { code: "TWO", name: "太和 (Tai Wo)" }, { code: "FAN", name: "粉嶺 (Fanling)" },
                { code: "SHS", name: "上水 (Sheung Shui)" }, { code: "LOW", name: "羅湖 (Lo Wu)" },
                { code: "LMC", name: "落馬洲 (Lok Ma Chau)" }
            ]
        };

        const allStationsDatabase = [];
        Object.keys(mtrDatabase).forEach(line => {
            mtrDatabase[line].forEach(station => {
                if (!allStationsDatabase.some(s => s.code === station.code && s.line === line)) {
                    allStationsDatabase.push({ line: line, code: station.code, name: station.name });
                }
            });
        });

        let pinnedList = [];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function switchPage(pageId, titleText, element) {
            const pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('headerTitle').innerText = titleText;
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => item.classList.remove('active'));
            if(element) element.classList.add('active');
            toggleSidebar();

            if (pageId === 'pinned') {
                fetchMTRData();
            }
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('mtr_theme', themeName);
        }

        function removePin(id) {
            pinnedList = pinnedList.filter(item => item.id !== id);
            fetchMTRData();
        }

        function addPin(line, stationCode, stationFullName) {
            const newId = `${line}-${stationCode}`;
            if (!pinnedList.some(item => item.id === newId)) {
                let lineNameMap = { "TWL": "荃灣綫", "ISL": "港島綫", "KTL": "觀塘綫", "TML": "屯馬綫", "EAL": "東鐵綫" };
                let lineName = lineNameMap[line] || line;
                pinnedList.push({ id: newId, line: line, station: stationCode, name: `${stationFullName} - ${lineName}` });
                alert("⭐ 成功加入釘選站！");
                fetchMTRData();
            } else {
                alert("💡 這個車站已經在你的釘選列表裏面了！");
            }
        }

        function updateStationOptions() {
            const lineSelect = document.getElementById('lineSelect').value;
            const stationSelect = document.getElementById('stationSelect');
            stationSelect.innerHTML = `<option value="" disabled selected>-- 請選擇車站 --</option>`;

            if (mtrDatabase[lineSelect]) {
                mtrDatabase[lineSelect].forEach(station => {
                    let opt = document.createElement('option');
                    opt.value = station.code;
                    opt.text = station.name;
                    stationSelect.appendChild(opt);
                });
            }
        }

        function filterStations(query) {
            const listContainer = document.getElementById('suggestionsList');
            if (!query.trim()) {
                listContainer.style.display = 'none';
                return;
            }

            const matched = allStationsDatabase.filter(s => s.name.toLowerCase().includes(query.toLowerCase()) || s.code.toLowerCase().includes(query.toLowerCase()));
            
            if (matched.length === 0) {
                listContainer.style.display = 'none';
                return;
            }

            let html = "";
            matched.forEach(item => {
                let lineNameMap = { "TWL": "荃灣綫", "ISL": "港島綫", "KTL": "觀塘綫", "TML": "屯馬綫", "EAL": "東鐵綫" };
                let lineName = lineNameMap[item.line] || item.line;
                html += `<div class="suggestion-item" onclick="selectStation('${item.line}', '${item.code}', '${item.name.split(' ')[0]}')">${item.name} <span style="opacity: 0.6; font-size: 12px;">[${lineName}]</span></div>`;
            });

            listContainer.innerHTML = html;
            listContainer.style.display = 'block';
        }

        function selectStation(line, code, name) {
            document.getElementById('stationSearchInput').value = `${name} (${line})`;
            document.getElementById('selectedLine').value = line;
            document.getElementById('selectedStationCode').value = code;
            document.getElementById('selectedStationName').value = name;
            document.getElementById('suggestionsList').style.display = 'none';
        }

        function translateDestination(destCode) {
            const destMap = {
                "CEN": "中環", "TSW": "荃灣", "CHW": "柴灣", "KET": "堅尼地城",
                "NOP": "北角", "QUB": "鰂魚涌", "WHA": "黃埔", "TIK": "調景嶺",
                "WKS": "烏溪沙", "TUM": "屯門", "LOW": "羅湖", "LMC": "落馬洲"
            };
            return destMap[destCode] || destCode;
        }

        function formatArrivalTime(rawTime) {
            if (rawTime === undefined || rawTime === null) return { text: "暫無資料", timeStr: "" };

            let arrivalDate;
            let num = Number(rawTime);
            let now = new Date();

            if (!isNaN(num)) {
                arrivalDate = new Date(now.getTime() + num * 60000);
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = num <= 0 ? "已到達" : `${num} 分鐘`;
                return { text: text, timeStr: timeStr };
            } else {
                arrivalDate = new Date(rawTime.replace(/-/g, "/"));
                let diffMs = arrivalDate - now;
                let diffMins = Math.ceil(diffMs / 60000);

                if (isNaN(arrivalDate.getTime())) {
                    return { text: "暫無資料", timeStr: "" };
                }

                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                let timeStr = `${hours}:${minutes}`;

                let text = diffMins <= 0 ? "已到達" : `${diffMins} 分鐘`;
                return { text: text, timeStr: timeStr };
            }
        }

        async function fetchMTRData() {
            const container = document.getElementById('pinnedStationsContainer');
            
            if (pinnedList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center;"><p>⭐ 你目前未有任何釘選站！</p><p style="font-size: 13px; opacity: 0.6;">去「搜尋車站」加返個站落嚟～</p></div>`;
                return;
            }

            let htmlContent = "";

            try {
                for (let item of pinnedList) {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
                    const data = await response.json();

                    htmlContent += `
                        <div class="card">
                            <button class="unpin-btn" onclick="removePin('${item.id}')" title="取消 Pin">❌</button>
                            <h3>📌 ${item.name}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${item.line}-${item.station}`]) {
                        const stationData = data.data[`${item.line}-${item.station}`];

                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const arrivalInfo = formatArrivalTime(platform[0].time);

                                htmlContent += `
                                    <div class="train-row">
                                        <span><strong>往 ${destName} 方向</strong> <span style="opacity: 0.8; font-size: 13px; margin-left: 6px; font-weight: bold; color: var(--accent-color);">${arrivalInfo.timeStr}</span></span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">暫時無法取得實時數據</p>`;
                    }

                    htmlContent += `</div>`;
                }

                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("取得港鐵數據失敗:", error);
                container.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">⚠️ 網絡連接發生錯誤...</p></div>`;
            }
        }

        async function searchStationTime() {
            const line = document.getElementById('lineSelect').value;
            const stationCode = document.getElementById('stationSelect').value;
            const resultContainer = document.getElementById('searchResultContainer');

            if (!line || !stationCode) {
                alert("⚠️ 請先選擇鐵路綫及車站！");
                return;
            }

            const stationDropdown = document.getElementById('stationSelect');
            const stationFullName = stationDropdown.options[stationDropdown.selectedIndex].text;

            resultContainer.innerHTML = `<div class="card"><p style="text-align: center;">⏳ 正在查詢 ${stationFullName} 實時資料...</p></div>`;

            try {
                const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${line}&sta=${stationCode}`);
                const data = await response.json();

                let htmlContent = `
                    <div class="card">
                        <h3>🔍 ${stationFullName} 實時候車時間</h3>
                `;

                if (data.status === 1 && data.data && data.data[`${line}-${stationCode}`]) {
                    const stationData = data.data[`${line}-${stationCode}`];

                    ['UP', 'DOWN'].forEach(dir => {
                        if (stationData[dir] && stationData[dir].length > 0) {
                            const platform = stationData[dir];
                            const destName = translateDestination(platform[0].dest);

                            htmlContent += `<div class="direction-title">往 ${destName} 方向</div>`;

                            platform.slice(0, 4).forEach((train) => {
                                const arrivalInfo = formatArrivalTime(train.time);
                                htmlContent += `
                                    <div class="train-card-row">
                                        <span class="train-time-left">${arrivalInfo.timeStr}</span>
                                        <span class="time-badge">${arrivalInfo.text}</span>
                                    </div>
                                `;
                            });
                        }
                    });

                    htmlContent += `
                        <button class="action-btn" style="margin-top: 15px;" onclick="addPin('${line}', '${stationCode}', '${stationFullName}')">⭐ 將此站加入釘選 (Pin)</button>
                    `;
                } else {
                    htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">暫時無法取得該車站實時數據</p>`;
                }

                htmlContent += `</div>`;
                resultContainer.innerHTML = htmlContent;

            } catch (error) {
                resultContainer.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">⚠️ 查詢失敗，請檢查網絡連接。</p></div>`;
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('mtr_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }

            // 帶入你提供嘅地圖圖片
            const userImg = document.getElementById('userProvidedMapImg');
            const userImg2 = document.getElementById('userProvidedMapImg2');
            const mapLink = document.getElementById('mapLink');
            
            // 由於直接引用上載圖片，如果環境支援可以直接帶入，或者用外部穩陣託管

            userImg2.src = "https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1?auto=format&fit=crop&w=1200&q=80";

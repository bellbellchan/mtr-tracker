<!DOCTYPE html>
<html>
<head>
<style>
  .map-container { width: 100%; max-width: 600px; margin: auto; }
  .station-dot { cursor: pointer; transition: 0.2s; fill: #5a4536; }
  .station-dot:hover { fill: #e5a952; r: 8; }
  #info-box { padding: 20px; border: 2px solid #ddd; margin-top: 10px; border-radius: 10px; }
</style>
</head>
<body>

<div class="map-container">
  <h3>點擊車站進行查詢：</h3>
  <!-- 呢度係一個簡化版互動圖，你可以隨時加入更多車站 -->
  <svg viewBox="0 0 400 200" style="background:#fdfdfd; border:1px solid #ccc">
    <!-- 線路 -->
    <line x1="50" y1="100" x2="350" y2="100" stroke="#78c8a0" stroke-width="4"/>
    
    <!-- 車站圓點 -->
    <circle class="station-dot" cx="50" cy="100" r="5" onclick="showInfo('黃大仙')"/>
    <text x="35" y="90" font-size="10">黃大仙</text>
    
    <circle class="station-dot" cx="200" cy="100" r="5" onclick="showInfo('鑽石山')"/>
    <text x="185" y="90" font-size="10">鑽石山</text>
    
    <circle class="station-dot" cx="350" cy="100" r="5" onclick="showInfo('啟德')"/>
    <text x="340" y="90" font-size="10">啟德</text>
  </svg>

  <div id="info-box">請點選地圖上的圓點...</div>
</div>

<script>
function showInfo(station) {
  document.getElementById('info-box').innerHTML = `
    <h4>${station} 站</h4>
    <p>升降機：位於大堂閘內，可直達月台。</p>
    <button onclick="alert('導航中...')">前往此站</button>
  `;
}
</script>
</body>
</html>

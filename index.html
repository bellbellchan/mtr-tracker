<!DOCTYPE html>
<html lang="zh-HK" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>港鐵實時資訊網 MTR Live Info</title>
    <style>
        /* 🎨 主題顏色變數設定 (5款精選風格) */
        :root[data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #38bdf8;
            --border-color: #333333;
            --header-bg: #1f1f1f;
        }
        :root[data-theme="light"] {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --accent-color: #0056b3;
            --border-color: #dddddd;
            --header-bg: #ffffff;
        }
        :root[data-theme="pink"] {
            --bg-color: #fff0f5;
            --card-bg: #ffffff;
            --text-color: #5a3d40;
            --accent-color: #e75480;
            --border-color: #ffb6c1;
            --header-bg: #ffe4e1;
        }
        :root[data-theme="blue"] {
            --bg-color: #0b132b;
            --card-bg: #1c2541;
            --text-color: #edf2f4;
            --accent-color: #4cc9f0;
            --border-color: #3a506b;
            --header-bg: #1c2541;
        }
        :root[data-theme="natural"] {
            --bg-color: #f3edd5;
            --card-bg: #fffbf0;
            --text-color: #4a3b32;
            --accent-color: #558b2f;
            --border-color: #d7ccc8;
            --header-bg: #e8dfc8;
        }

        /* 🌐 全局基本樣式 */
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            transition: background 0.3s, color 0.3s;
        }

        header {
            background-color: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .menu-btn {
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-color);
            cursor: pointer;
        }

        h1 {
            font-size: 18px;
            margin: 0;
        }

        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            position: relative;
        }

        .auto-refresh-badge {
            font-size: 12px;
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 4px 8px;
            border-radius: 20px;
        }

        /* 📱 側邊導航選單 (Sidebar) */
        .sidebar {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            box-shadow: 4px 0 10px rgba(0,0,0,0.1);
            transition: left 0.3s ease;
            z-index: 2000;
            padding: 20px;
            box-sizing: border-box;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 20px;
            color: var(--text-color);
            cursor: pointer;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--accent-color);
            color: #ffffff;
        }

        .sidebar-section {
            margin-top: 25px;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
        }

        .sidebar-section label {
            font-size: 14px;
            display: block;
            margin-bottom: 8px;
        }

        select {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 14px;
        }

        /* 遮罩背景 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            display: none;
            z-index: 1500;
        }
        .overlay.show {
            display: block;
        }

        /* 頁面切換內容區 */
        .page-content {
            display: none;
        }
        .page-content.active {
            display: block;
        }

        /* 列車時間樣式 */
        .train-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px dashed var(--border-color);
            font-size: 14px;
        }
        .time-badge {
            background-color: var(--accent-color);
            color: #ffffff;
            padding: 2px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13px;
        }

        /* 取消 Pin 按鈕 */
        .unpin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: none;
            border: none;
            font-size: 16px;
            cursor: pointer;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .unpin-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- 頂部導航欄 -->
    <header>
        <button class="menu-btn" onclick="toggleSidebar()">...</button>
        <h1 id="headerTitle">⭐ 我的釘選站 (Pinned)</h1>
        <div class="auto-refresh-badge">⏱️ 15s</div>
    </header>

    <!-- 側邊選單 (Sidebar) -->
    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>🧭 導航選單</h3>
            <button class="close-btn" onclick="toggleSidebar()">✕</button>
        </div>

        <div class="menu-item active" onclick="switchPage('pinned', '⭐ 我的釘選站 (Pinned)')">⭐ 實時候車時間 (已Pin)</div>
        <div class="menu-item" onclick="switchPage('search', '🔍 搜尋全港車站')">🔍 搜尋全港車站</div>
        <div class="menu-item" onclick="switchPage('transfer', '🗺️ 轉車路線規劃')">🗺️ 轉車路線規劃</div>
        <div class="menu-item" onclick="switchPage('lift', '🛗 車站地面升降機')">🛗 車站地面升降機</div>

        <div class="sidebar-section">
            <label for="themeSelect">🎨 選擇外觀風格：</label>
            <select id="themeSelect" onchange="changeTheme(this.value)">
                <option value="dark">黑色風格 (Dark Mode)</option>
                <option value="light">白色風格 (Light Mode)</option>
                <option value="pink">粉紅色風格 (Pink Theme)</option>
                <option value="blue">深藍色風格 (Dark Blue)</option>
                <option value="natural">自然風格 (Natural Style)</option>
            </select>
        </div>
    </div>

    <!-- 主要內容區 -->
    <div class="container">

        <!-- 頁面 1：釘選站 (Pinned) -->
        <div id="page-pinned" class="page-content active">
            <div id="pinnedStationsContainer">
                <div class="card">
                    <p style="text-align: center;">⏳ 正在向港鐵系統取得實時數據...</p>
                </div>
            </div>
            <p style="text-align: center; font-size: 13px; opacity: 0.6;">💡 提示：畫面每 15 秒會在背景自動更新一次。</p>
        </div>

        <!-- 頁面 2：搜尋全港車站 -->
        <div id="page-search" class="page-content">
            <div class="card">
                <h3>🔍 搜尋全港車站候車時間</h3>
                <p>（下一步即將為你解鎖完整搜尋功能...）</p>
            </div>
        </div>

        <!-- 頁面 3：轉車路線規劃 -->
        <div id="page-transfer" class="page-content">
            <div class="card">
                <h3>🗺️ 轉車路線規劃</h3>
                <p>（縮放港鐵地圖與車卡升降機建議準備中...）</p>
            </div>
        </div>

        <!-- 頁面 4：車站地面升降機 -->
        <div id="page-lift" class="page-content">
            <div class="card">
                <h3>🛗 車站地面升降機指南</h3>
                <p>（雙軌查詢與升降機卡片準備中...）</p>
            </div>
        </div>

    </div>

    <script>
        let pinnedList = [
            { id: "TWL-MOK", line: "TWL", station: "MOK", name: "旺角站 (Mong Kok) - 荃灣綫" },
            { id: "ISL-ADM", line: "ISL", station: "ADM", name: "金鐘站 (Admiralty) - 港島綫" }
        ];

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function switchPage(pageId, titleText) {
            const pages = document.querySelectorAll('.page-content');
            pages.forEach(page => page.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            document.getElementById('headerTitle').innerText = titleText;
            const items = document.querySelectorAll('.menu-item');
            items.forEach(item => item.classList.remove('active'));
            event.target.classList.add('active');
            toggleSidebar();
        }

        function changeTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('mtr_theme', themeName);
        }

        function removePin(id) {
            pinnedList = pinnedList.filter(item => item.id !== id);
            fetchMTRData();
        }

        function translateDestination(destCode) {
            const destMap = {
                "CEN": "中環",
                "TSW": "荃灣",
                "CHW": "柴灣",
                "KET": "堅尼地城",
                "NOP": "北角",
                "QUB": "鰂魚涌"
            };
            return destMap[destCode] || destCode;
        }

        // 同時顯示「幾多分鐘後」同「hh:mm」時間
        function formatArrivalTime(rawTime) {
            if (rawTime === undefined || rawTime === null) return "暫無資料";

            let arrivalDate;
            let num = Number(rawTime);

            if (!isNaN(num)) {
                if (num <= 0) return "已到達";
                arrivalDate = new Date(new Date().getTime() + num * 60000);
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                return `${num} 分鐘後 (${hours}:${minutes})`;
            } else {
                arrivalDate = new Date(rawTime.replace(/-/g, "/"));
                let now = new Date();
                let diffMs = arrivalDate - now;
                let diffMins = Math.round(diffMs / 60000);

                if (isNaN(arrivalDate.getTime()) || diffMins <= 0) {
                    return "已到達";
                }
                let hours = String(arrivalDate.getHours()).padStart(2, '0');
                let minutes = String(arrivalDate.getMinutes()).padStart(2, '0');
                return `${diffMins} 分鐘後 (${hours}:${minutes})`;
            }
        }

        async function fetchMTRData() {
            const container = document.getElementById('pinnedStationsContainer');
            
            if (pinnedList.length === 0) {
                container.innerHTML = `<div class="card" style="text-align: center;"><p>⭐ 你目前未有任何釘選站！</p><p style="font-size: 13px; opacity: 0.6;">去「搜尋全港車站」可以再加返架～</p></div>`;
                return;
            }

            let htmlContent = "";

            try {
                for (let item of pinnedList) {
                    const response = await fetch(`https://rt.data.gov.hk/v1/transport/mtr/getSchedule.php?line=${item.line}&sta=${item.station}`);
                    const data = await response.json();

                    htmlContent += `
                        <div class="card">
                            <button class="unpin-btn" onclick="removePin('${item.id}')" title="取消 Pin">❌</button>
                            <h3>📌 ${item.name}</h3>
                    `;

                    if (data.status === 1 && data.data && data.data[`${item.line}-${item.station}`]) {
                        const stationData = data.data[`${item.line}-${item.station}`];

                        ['UP', 'DOWN'].forEach(dir => {
                            if (stationData[dir] && stationData[dir].length > 0) {
                                const platform = stationData[dir];
                                const destName = translateDestination(platform[0].dest);
                                const timeText = formatArrivalTime(platform[0].time);

                                htmlContent += `
                                    <div class="train-row">
                                        <span><strong>往 ${destName} 方向</strong></span>
                                        <span class="time-badge">${timeText}</span>
                                    </div>
                                `;
                            }
                        });
                    } else {
                        htmlContent += `<p style="font-size: 14px; opacity: 0.7; margin-top: 10px;">暫時無法取得實時數據</p>`;
                    }

                    htmlContent += `</div>`;
                }

                container.innerHTML = htmlContent;
            } catch (error) {
                console.error("取得港鐵數據失敗:", error);
                container.innerHTML = `<div class="card"><p style="text-align: center; color: #f87171;">⚠️ 網絡連接發生錯誤，正嘗試自動重新整理...</p></div>`;
            }
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem('mtr_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
                document.getElementById('themeSelect').value = savedTheme;
            }

            fetchMTRData();
            setInterval(fetchMTRData, 15000);
        };
    </script>

</body>
</html>
